<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rolloplaner</title>
<style>
  :root{
    --bg:#10141a; --flaeche:#181d25; --flaeche2:#1e2530; --flaeche3:#242c38;
    --linie:#2b323d; --text:#e9edf2; --leise:#8b95a4; --grau:#5f6875;
    --marke:#5aa9e6; --sonne:#e8a23d; --offen:#4cc38a; --zu:#5f6875;
    --achtung:#e36d6d; --warnung:#e0a44a; --ok:#4cc38a;

    --l1:4px; --l2:8px; --l3:12px; --l4:16px; --l5:24px; --l6:36px;
    --rund:10px; --rund-gross:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;
    font-size:15px; line-height:1.55; min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  /* ═══ Kopf ═══ */
  .kopf{display:flex; align-items:center; gap:var(--l4); flex-wrap:wrap;
    padding:var(--l3) var(--l5); border-bottom:1px solid var(--linie);
    background:var(--flaeche)}
  .kopf .marke{display:flex; align-items:baseline; gap:var(--l2); flex:1; min-width:180px}
  .kopf h1{font-size:1.05rem; font-weight:600; letter-spacing:.01em}
  .kopf .fassung{font-size:.72rem; color:var(--grau)}
  .kopf-rechts{display:flex; align-items:center; gap:var(--l3); flex-wrap:wrap}
  .punkt{width:8px; height:8px; border-radius:50%; background:var(--achtung); flex:none}
  .punkt.ok{background:var(--ok)}
  .kopf .zustand{display:flex; align-items:center; gap:var(--l1);
    font-size:.8rem; color:var(--leise)}

  nav{display:flex; gap:var(--l1); padding:0 var(--l5); border-bottom:1px solid var(--linie);
    overflow-x:auto; background:var(--flaeche)}
  nav button{background:none; border:none; border-bottom:2px solid transparent;
    color:var(--leise); padding:var(--l3) var(--l4); font-size:.9rem; font-weight:500;
    cursor:pointer; white-space:nowrap; font-family:inherit}
  nav button:hover{color:var(--text)}
  nav button.an{color:var(--text); border-bottom-color:var(--marke)}
  nav button:focus{outline:none}
  nav button:focus-visible{outline:2px solid var(--marke); outline-offset:-2px}
  nav .zaehler{display:inline-block; margin-left:6px; padding:0 6px; border-radius:9px;
    background:var(--achtung); color:#fff; font-size:.7rem; font-weight:700}

  main{width:100%; max-width:1120px; margin:0 auto; padding:var(--l5) var(--l5) var(--l6)}
  section{display:none}
  section.an{display:block}

  /* ═══ Bausteine ═══ */
  .tafel{background:var(--flaeche); border:1px solid var(--linie);
    border-radius:var(--rund-gross); padding:var(--l4) var(--l5)}
  .tafel + .tafel{margin-top:var(--l4)}
  .tafel > h2{font-size:.72rem; text-transform:uppercase; letter-spacing:.13em;
    color:var(--leise); font-weight:600; margin-bottom:var(--l4)}
  .abschnitt{margin-bottom:var(--l5)}
  .abschnitt:last-child{margin-bottom:0}
  .abschnitt > h3{font-size:.86rem; font-weight:600; margin-bottom:var(--l3);
    padding-bottom:var(--l2); border-bottom:1px solid var(--linie)}

  button{border:none; border-radius:var(--rund); padding:var(--l2) var(--l4);
    font-size:.88rem; font-weight:600; cursor:pointer;
    background:var(--marke); color:#06172a; font-family:inherit}
  button:hover{filter:brightness(1.08)}
  button:disabled{opacity:.4; cursor:default; filter:none}
  button.leise{background:transparent; color:var(--leise); border:1px solid var(--linie);
    font-weight:500; padding:6px var(--l3)}
  button.leise:hover{color:var(--text); border-color:var(--leise); filter:none}
  button.leise.gefahr:hover{color:var(--achtung); border-color:var(--achtung)}

  input[type=text],input[type=number],input[type=time],input[type=search],select,textarea{
    background:var(--flaeche2); border:1px solid var(--linie); border-radius:var(--rund);
    color:var(--text); padding:7px var(--l3); font-size:.88rem; width:100%;
    color-scheme:dark; font-family:inherit}
  input:focus,select:focus{outline:2px solid var(--marke); outline-offset:1px;
    border-color:transparent}
  label.feld{display:block; margin-bottom:var(--l3)}
  label.feld > span{display:block; font-size:.78rem; color:var(--leise); margin-bottom:3px}
  label.haken{display:flex; align-items:baseline; gap:var(--l2); font-size:.88rem;
    cursor:pointer; margin-bottom:var(--l2)}
  label.haken input{width:auto; flex:none; accent-color:var(--marke); margin:0}
  .gitter{display:grid; gap:var(--l3)}
  .g2{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  .g3{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .hinweis{font-size:.78rem; color:var(--grau); margin-top:2px}

  .hakenliste{background:var(--flaeche2); border:1px solid var(--linie);
    border-radius:var(--rund); padding:var(--l1); max-height:190px; overflow-y:auto}
  .hakenliste.kurz{max-height:150px}
  .hakenliste label{display:flex; align-items:baseline; gap:var(--l2);
    padding:4px 6px; border-radius:5px; font-size:.86rem; cursor:pointer}
  .hakenliste .h-text{flex:1 1 auto; min-width:0; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis}
  .hakenliste label:hover, .hakenliste label.an{background:var(--flaeche3)}
  .hakenliste input{width:auto; flex:none; accent-color:var(--marke); margin:0}
  .hakenliste .h-eid{color:var(--grau); font-size:.78rem}
  .hakenliste .h-gruppe{font-size:.72rem; letter-spacing:.06em; text-transform:uppercase;
    color:var(--grau); padding:8px 6px 3px}
  .hakenliste .h-gruppe:first-child{padding-top:2px}
  .hakenliste .h-leer{padding:10px 6px; color:var(--grau); font-size:.82rem}

  /* ═══ Räume ═══ */
  .raumliste{display:grid; gap:var(--l3); align-items:stretch;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .raum{display:flex; flex-direction:column}
  .raum .raum-fuss{margin-top:auto}
  .raum{background:var(--flaeche); border:1px solid var(--linie);
    border-radius:var(--rund-gross); padding:var(--l4); position:relative}
  .raum.aus{opacity:.55}
  .raum-kopf{display:flex; align-items:flex-start; gap:var(--l3); margin-bottom:var(--l3)}
  .raum-kopf h3{font-size:.98rem; font-weight:600; flex:1; overflow-wrap:anywhere}
  .raum-kopf .rechts{display:flex; flex-direction:column; align-items:flex-end}
  .raum-kopf .lage{font-size:.72rem; color:var(--leise)}
  /* „Plan: zu" steht nur da, wenn das Rollo woanders steht – etwas
     zurückgenommen, damit die Zahl darüber die Hauptaussage bleibt. */
  .raum-kopf .lage.plan{font-style:italic; opacity:.8}
  .raum-ziel{font-size:1.5rem; font-weight:300; letter-spacing:-.02em}
  .raum-ziel small{font-size:.8rem; color:var(--leise); margin-left:2px}
  .raum-grund{font-size:.82rem; color:var(--leise); min-height:2.4em}
  .raum-fuss{display:flex; align-items:center; gap:var(--l2); flex-wrap:wrap;
    margin-top:var(--l3); padding-top:var(--l3); border-top:1px solid var(--linie);
    font-size:.78rem; color:var(--grau)}
  /* Der Schieber: eine Zeile für sich, weil er die ganze Breite braucht.
     Zwischen zwei Knöpfen gequetscht träfe man auf einem Wandtablett keine
     50 %, sondern irgendetwas zwischen 30 und 70. */
  .raum-schieber{display:flex; align-items:center; gap:var(--l3);
    margin-top:var(--l3)}
  .raum-schieber input[type=range]{flex:1; min-width:0; accent-color:var(--ton);
    margin:0; cursor:pointer}
  .raum-schieber .wert{font-size:.78rem; color:var(--leise);
    font-variant-numeric:tabular-nums; min-width:3.4em; text-align:right}
  /* Der Halt gehört zwischen auf und zu – so steht er auf jedem Handsender,
     und die Hand findet ihn, ohne hinzusehen. */
  .raum-fuss .halt{font-weight:600}
  /* „dann zu um 20:03 Uhr" braucht eine Mindestbreite, sonst quetscht der
     dritte Knopf den Satz auf drei Zeilen. Reicht der Platz nicht, rutscht
     er lieber ganz in eine eigene Zeile. */
  .raum-fuss > span:first-child{flex:1 1 9em}
  /* ═══ Rollladen vor Fenster oder Tür ═══ */
  /* ── Rollladen vor Fenster oder Tür ──
     Die Eigenschaft --zu geht von 0 % (ganz offen) bis 100 % (ganz
     geschlossen); der Panzer hängt von oben herunter, darunter kommt die
     Öffnung zum Vorschein.

     Beide Bilder stecken in einer Box gleicher Höhe, damit in einer
     Kachelreihe nichts springt. Der Unterschied steckt in zwei Dingen: Die
     Tür reicht bis zur Bodenlinie hinunter, das Fenster hängt darüber in
     der Wand – und die Tür hat einen sichtbaren Flügelrahmen mit Griff.
     Ohne den Rahmen war sie nur ein schmales hohes Rechteck mit einem
     Griff an der Seite, und das sieht aus wie ein Kühlschrank.

     Die Farben folgen bewusst nicht dem Farbschema: Das ist kein
     Bedienelement, sondern das Bild eines Gegenstands. Ein Rollladen ist
     hellgrau, und was dahinterliegt, ist Himmel. */
  .bild{height:46px; display:flex; align-items:flex-start; flex:none;
    position:relative; padding-bottom:3px}
  .bild::after{content:""; position:absolute; left:-2px; right:-2px; bottom:0;
    height:1.5px; border-radius:1px; background:currentColor; opacity:.35}
  .rollo{position:relative; border-radius:2px; overflow:hidden;
    border:1px solid rgba(0,0,0,.45);
    background:linear-gradient(160deg,#7fb4d8,#4a7fa5)}
  .rollo.fenster{height:74%; width:calc(46px*1.16); margin-top:5%}
  .rollo.tuer{height:calc(100% - 3px); width:calc(46px*.76)}
  /* Die Zarge: an drei Seiten, **unten offen**. Genau daran erkennt man
     eine Tür – ein umlaufender Rahmen ist ein Fensterrahmen, und die Tür
     wirkte damit wie ein Kasten, der über dem Boden schwebt. */
  .rollo .fluegel{position:absolute; inset:0; border:2px solid #e2e7ec;
    border-bottom:none; border-radius:1px 1px 0 0}
  .rollo .griff{position:absolute; right:3px; top:47%; width:4px; height:1.5px;
    border-radius:1px; background:#3d4750}
  .rollo .panzer{position:absolute; left:0; right:0; top:0; height:var(--zu,0%);
    transition:height .6s ease; box-shadow:0 1px 3px rgba(0,0,0,.5);
    background:repeating-linear-gradient(to bottom,#cfd6de 0 3px,#9aa5b1 3px 4px)}
  /* Die Endleiste – ohne sie sieht der Panzer aus wie eine Schraffur */
  .rollo .panzer::after{content:""; position:absolute; left:0; right:0; bottom:0;
    height:2px; background:#7d8894}
  /* Der Kasten, in dem der Panzer aufgerollt liegt: auch bei ganz offenem
     Rollo sichtbar, sonst fehlte dem Bild oben der Abschluss. */
  .rollo .kasten{position:absolute; left:0; right:0; top:0; height:4px;
    background:linear-gradient(to bottom,#b8c1cb,#8e99a5)}

  .rollo-zeile{display:flex; align-items:baseline; gap:var(--l2); font-size:.8rem;
    padding:2px 0}
  .rollo-zeile .r-name{flex:1; min-width:0; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; color:var(--leise)}
  .rollo-zeile .r-wert{font-variant-numeric:tabular-nums}

  .marke-schild{display:inline-flex; align-items:center; gap:4px; padding:1px 8px;
    border-radius:20px; font-size:.72rem; font-weight:600; letter-spacing:.02em}
  .m-plan{background:#1d3247; color:#8fc4ee}
  .m-beschattung{background:#3d3016; color:#e8c07d}
  .m-urlaub{background:#173a2c; color:#79d3a8}
  .m-rauch{background:#3f1d1d; color:#f0a0a0}
  .m-fenster{background:#2f2a45; color:#b8aae4}
  .m-manuell{background:#2f3540; color:#b5bdc9}
  .m-aus,.m-gesperrt{background:#242a33; color:#7b8493}

  table{width:100%; border-collapse:collapse; font-size:.85rem}
  th{text-align:left; font-size:.72rem; text-transform:uppercase; letter-spacing:.08em;
    color:var(--grau); font-weight:600; padding:var(--l2) var(--l3);
    border-bottom:1px solid var(--linie)}
  td{padding:var(--l2) var(--l3); border-bottom:1px solid var(--linie);
    vertical-align:top}
  tr:last-child td{border-bottom:none}
  td.zeit{color:var(--grau); font-variant-numeric:tabular-nums; white-space:nowrap}
  .art-fehler{color:var(--achtung)} .art-warnung{color:var(--warnung)}
  .art-gut{color:var(--ok)}

  /* ═══ Zeitplan ═══ */
  .punktliste{display:grid; gap:var(--l2)}
  .punkt-zeile,.punkt-kopf{display:grid; gap:var(--l2); align-items:center;
    grid-template-columns:minmax(120px,1fr) minmax(96px,auto) minmax(110px,1fr)
                          minmax(130px,1fr) auto}
  .punkt-zeile{background:var(--flaeche2); border:1px solid var(--linie);
    border-radius:var(--rund); padding:var(--l2) var(--l3)}
  /* Ohne Beschriftung ist „Sonnenuntergang · 0 · --:-- · 22:00 · 0“ nicht zu
     lesen: Vier Zahlenfelder nebeneinander, und keines sagt, wofür es steht. */
  .punkt-kopf{padding:0 var(--l3); font-size:.7rem; letter-spacing:.06em;
    text-transform:uppercase; color:var(--grau); font-weight:600}
  .punkt-kopf span:last-child{opacity:0}
  .punkt-zeile select,.punkt-zeile input{width:100%}
  .wennzeile{display:flex; gap:var(--l2); align-items:center; flex-wrap:wrap;
    grid-column:1/-1; font-size:.8rem; color:var(--leise)}
  .wennzeile select{width:auto; max-width:260px; flex:1 1 180px}
  .wennzeile input{width:auto; max-width:150px}
  .wennzeile .w-weg{padding:2px 8px}
  .tagewahl{display:flex; gap:2px; flex-wrap:wrap}
  .tagewahl label{position:relative}
  .tagewahl input{position:absolute; opacity:0; width:1px; height:1px}
  .tagewahl span{display:inline-block; min-width:26px; text-align:center;
    padding:3px 4px; border-radius:6px; background:var(--flaeche3);
    color:var(--grau); font-size:.72rem; font-weight:600; cursor:pointer}
  .tagewahl input:checked + span{background:var(--marke); color:#06172a}
  .tagewahl input:focus-visible + span{outline:2px solid var(--marke); outline-offset:1px}

  .leerhinweis{color:var(--grau); font-size:.86rem; padding:var(--l4) 0; text-align:center}
  dialog{background:var(--flaeche); color:var(--text); border:1px solid var(--linie);
    border-radius:var(--rund-gross); padding:0; max-width:min(860px,94vw); width:100%}
  dialog::backdrop{background:rgba(6,9,13,.72)}
  .dlg-kopf{display:flex; align-items:center; gap:var(--l3); padding:var(--l4) var(--l5);
    border-bottom:1px solid var(--linie)}
  .dlg-kopf h2{font-size:1rem; font-weight:600; flex:1}
  .dlg-inhalt{padding:var(--l4) var(--l5); max-height:66vh; overflow-y:auto}
  .dlg-fuss{display:flex; gap:var(--l2); justify-content:flex-end;
    padding:var(--l3) var(--l5); border-top:1px solid var(--linie)}
  .fehler{background:#33191b; border:1px solid #5c2a2d; color:#f0b4b4;
    border-radius:var(--rund); padding:var(--l2) var(--l3); font-size:.84rem;
    margin-bottom:var(--l3)}
  .befund{display:flex; gap:var(--l3); padding:var(--l2) 0; font-size:.86rem;
    border-bottom:1px solid var(--linie)}
  .befund:last-child{border-bottom:none}
  .befund .b-raum{color:var(--grau); font-size:.78rem; white-space:nowrap}
  .melder{position:fixed; right:var(--l4); bottom:var(--l4); z-index:9;
    background:var(--flaeche3); border:1px solid var(--linie); color:var(--text);
    border-radius:var(--rund); padding:var(--l2) var(--l4); font-size:.85rem;
    box-shadow:0 8px 24px rgba(0,0,0,.4); opacity:0; transform:translateY(8px);
    transition:opacity .18s, transform .18s; pointer-events:none}
  .melder.an{opacity:1; transform:none}
  .melder.schlecht{border-color:#5c2a2d; color:#f0b4b4}
  .sonne-zeile{display:flex; gap:var(--l4); flex-wrap:wrap; font-size:.82rem;
    color:var(--leise)}
  .sonne-zeile b{color:var(--text); font-weight:600}

  /* ═══ Rolloliste, nach Raum geordnet ═══ */
  .raumtitel{font-size:.72rem; text-transform:uppercase; letter-spacing:.13em;
    color:var(--leise); font-weight:600; margin:var(--l4) 0 0;
    grid-column:1/-1; padding-bottom:var(--l1);
    border-bottom:1px solid var(--linie)}
  .raumtitel:first-child{margin-top:0}
  /* Die Ampelzeile im Rauchalarm-Reiter. Wer ihn aufmacht, will in einem Blick
     sehen, ob die Sache scharf ist – nicht erst vier Kästchen durchlesen. */
  .lampenzeile{display:flex; gap:var(--l2); flex-wrap:wrap; margin-bottom:var(--l3)}
  .lampe{display:inline-flex; align-items:center; gap:6px; padding:2px 10px;
    border-radius:14px; font-size:.82rem; font-weight:500;
    border:1px solid var(--linie); color:var(--grau)}
  .lampe::before{content:""; width:8px; height:8px; border-radius:50%;
    background:currentColor; flex:none}
  .lampe.gut{color:var(--text); border-color:var(--ok)}
  .lampe.gut::before{background:var(--ok)}
  .lampe.schlecht{color:var(--text); border-color:var(--achtung)}
  .lampe.schlecht::before{background:var(--achtung)}
  .planschild{display:inline-flex; align-items:center; gap:4px; padding:1px 8px;
    border-radius:20px; font-size:.72rem; font-weight:600;
    background:var(--flaeche3); color:var(--leise)}
  .planschild.eigen{background:transparent; border:1px dashed var(--linie)}
  td.knopfspalte{text-align:right; white-space:nowrap}
  /* Im Gruppen-Reiter zog das Auswahlfeld die Zeile über die ganze Breite
     auseinander – ein Feld, das man selten braucht, soll nicht das Bild
     bestimmen. Es bekommt eine feste Breite, die Pfeile rücken daneben. */
  .gruppenzeile{display:flex; align-items:center; gap:var(--l3);
    padding:var(--l2) var(--l3) var(--l2) 0; border-bottom:1px solid var(--linie)}
  .gruppenzeile:last-of-type{border-bottom:none}
  .gruppenzeile .g-name{flex:1 1 auto; min-width:0}
  .gruppenzeile .g-name b{display:block; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap}
  .gruppenzeile .g-pfeile{display:flex; gap:2px; flex:none}
  .gruppenzeile select{flex:none; width:210px; max-width:40vw}
  /* Rechts Luft lassen: Ohne sie klebt das Auswahlfeld am Rand der Tafel. */
  .gruppenzeile > :last-child{margin-right:var(--l2)}
  tr.raumzeile td{font-size:.72rem; text-transform:uppercase; letter-spacing:.13em;
    color:var(--leise); font-weight:600; padding-top:var(--l4);
    border-bottom:1px solid var(--linie)}
  tr.raumzeile:first-child td{padding-top:var(--l1)}
</style>
</head>
<body>

<header class="kopf">
  <div class="marke">
    <h1>Rolloplaner</h1>
    <span class="fassung" id="fassung"></span>
  </div>
  <div class="kopf-rechts">
    <span class="zustand"><span class="punkt" id="punkt"></span><span id="kopfstatus">…</span></span>
    <button class="leise" id="btn-durchsetzen"
            data-t-titel="kopf.durchsetzen.titel"
            data-t="kopf.durchsetzen">Plan durchsetzen</button>
    <button class="leise" id="btn-takt" data-t="kopf.rechnen">Jetzt rechnen</button>
  </div>
</header>

<nav>
  <button data-reiter="uebersicht" class="an" data-t="nav.uebersicht">Übersicht</button>
  <button data-reiter="rollos" data-t="nav.rollos">Rollos</button>
  <button data-reiter="gruppen" data-t="nav.gruppen">Gruppen</button>
  <button data-reiter="plaene" data-t="nav.plaene">Zeitpläne</button>
  <button data-reiter="schalter" data-t="nav.schalter">Schalter</button>
  <button data-reiter="rauchalarm" data-t="nav.rauchalarm">Rauchalarm</button>
  <button data-reiter="einstellungen" data-t="nav.einstellungen">Einstellungen</button>
  <button data-reiter="protokoll" data-t="nav.protokoll">Protokoll</button>
  <button data-reiter="einrichtung"><span data-t="nav.einrichtung">Einrichtung</span><span class="zaehler" id="z-einrichtung" hidden></span></button>
</nav>

<main>
  <!-- ══════════════════════════════════════════════════ Übersicht ═══ -->
  <section id="s-uebersicht" class="an">
    <div class="tafel">
      <h2 data-t="tafel.lage">Lage</h2>
      <div class="sonne-zeile" id="lage"></div>
    </div>
    <div class="tafel" id="stoerungen-tafel" hidden>
      <h2 data-t="tafel.stoerungen">Störungen</h2>
      <div id="stoerungen"></div>
    </div>
    <div id="uebersicht-rollos"></div>
  </section>

  <!-- ═════════════════════════════════════════════════════ Rollos ═══ -->
  <section id="s-rollos">
    <div class="tafel">
      <h2 data-t="tafel.rollos">Rollos</h2>

   Darum Funktionen und keine Konstanten – sie werden bei jedem Zeichnen neu
   gebaut, und ein Sprachwechsel greift ohne Neuladen. */
const TAGCODES = ["mon","tue","wed","thu","fri","sat","sun"];
const TAGE = () => TAGCODES.map((w, i) => [w, t("tage.kurz").split(",")[i]]);
const AUSLOESER = () => ["uhrzeit","sonnenaufgang","sonnenuntergang","daemmerung"]
  .map((w) => [w, t("aus." + w)]);
const GELTUNG = () => ["immer","schultag","schulfrei","morgen_schultag","morgen_schulfrei"]
  .map((w) => [w, t("gilt." + w)]);
const STRICHE = () => t("allg.striche").split(",");
/* Ein Fenster zeigt selten genau nach Süden. Steht ein Haus schräg zur
   Himmelsrichtung – und das tun die meisten –, sind die 22 Grad Unterschied
   zwischen „Süd“ und „SSO“ am Nachmittag eine gute Stunde Sonne. */
function strich(grad){
  if (grad === null || grad === undefined || grad === "") return "";
  return STRICHE()[Math.round(((Number(grad) % 360) + 360) % 360 / 22.5) % 16];
}

let SPRACHE = "de";

function t(schluessel, werte){
  // Einzahl: Steht neben dem Schlüssel einer mit `_1`, gilt der bei genau
  // einem Stück. „1 own points" liest sich sonst wie ein Tippfehler – und in
  // einer Sprache, die man selbst nicht spricht, sieht so etwas niemand nach.
  const wahl = werte && Number(werte.n) === 1 && (UI[SPRACHE]?.[schluessel + "_1"]
    ?? UI.de[schluessel + "_1"]) !== undefined ? schluessel + "_1" : schluessel;
  const vorlage = UI[SPRACHE]?.[wahl] ?? UI.de[wahl] ?? UI.de[schluessel] ?? schluessel;
  if (!werte) return vorlage;
  return vorlage.replace(/\{(\w+)\}/g, (ganz, name) =>
    werte[name] !== undefined ? werte[name] : ganz);
}

/* Die feste Struktur trägt ihre Schlüssel als `data-t` am Element. Das ist
   weniger Umbau als jeden Text durch eine Funktion zu schicken – und es
   bleibt lesbar, wenn man die Seite im Quelltext liest. */
function texteSetzen(){
  document.documentElement.lang = SPRACHE;
  // Manche Texte tragen Auszeichnung – <b>, <code>, <br>. Sie stammen aus der
  // Tabelle in dieser Datei und nicht von außen; deshalb darf hier `innerHTML`
  // stehen, und auch nur da, wo wirklich eine Marke drin steckt.
  $$("[data-t]").forEach((el) => {
    const text = t(el.dataset.t);
    if (text.includes("<")) el.innerHTML = text; else el.textContent = text;
  });
  $$("[data-t-titel]").forEach((el) => { el.title = t(el.dataset.tTitel); });
}
let ENTWURF = null;        // was im Dialog gerade bearbeitet wird
let DIALOGART = null;      // "rollo" | "plan"

const $ = (s, wurzel=document) => wurzel.querySelector(s);
const $$ = (s, wurzel=document) => [...wurzel.querySelectorAll(s)];
const esc = (t) => String(t ?? "").replace(/[&<>"]/g,
  (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function melden(text, schlecht=false){
  const m = $("#melder");
  m.textContent = text;
  m.classList.toggle("schlecht", schlecht);
  m.classList.add("an");
  clearTimeout(melden._t);
  melden._t = setTimeout(() => m.classList.remove("an"), 3600);
}

async function hole(pfad, optionen){
  const antwort = await fetch(pfad, optionen);
  const text = await antwort.text();
  let daten = null;
  try { daten = text ? JSON.parse(text) : null; } catch { daten = null; }
  if (!antwort.ok) throw new Error((daten && daten.fehler) || antwort.statusText);
  return daten;
}
const holeJSON = (pfad, methode, koerper) => hole(pfad, {
  method: methode, headers: {"Content-Type":"application/json"},
  body: koerper === undefined ? undefined : JSON.stringify(koerper)});

function uhrzeit(iso){
  if (!iso) return "–";
  const d = new Date(iso);
  // 24 Stunden in beiden Sprachen: „7:30 PM" neben einem Zeitplan, der in
  // 19:30 gedacht ist, liest sich falsch.
  return isNaN(d) ? "–" : d.toLocaleTimeString(SPRACHE === "en" ? "en-GB" : "de-DE",
                                               {hour:"2-digit", minute:"2-digit"});
}

/* Home Assistant zählt 100 % = offen, Amazon Echo andersherum. Ist die
   Zählweise umgedreht, dreht sich alles, was der Benutzer sieht und eingibt –
   gespeichert wird aber immer in der Zählweise von Home Assistant. Sonst
   stünde nach jedem Umschalten jeder Zeitplan auf dem Kopf.

   `zeige` und `lies` sind dieselbe Rechnung: Ein Vertauschen fällt deshalb
   nicht auf, und darum steht sie an genau einer Stelle. */
const invertiert = () => Boolean(CONFIG?.einstellungen?.prozent_invertiert);
const zeige = (wert) => (wert === null || wert === undefined || !invertiert())
  ? wert : 100 - Number(wert);
const lies = zeige;

/* Der Name eines Rollos: eigener Name, sonst der aus Home Assistant, sonst
   die Entität. An drei Stellen gebraucht – deshalb hier und nicht dreimal. */
function rolloName(rollo){
  if (rollo.name) return rollo.name;
  const k = (ENTITAETEN?.rollos || []).find((x) => x.entity_id === rollo.entity_id);
  return (k && k.name) || rollo.entity_id;
}

function stellungstext(p){
  if (p === null || p === undefined) return "–";
  // „offen“ und „zu“ hängen nicht an der Zählweise – nur die Zahl dazwischen.
  if (p >= 100) return t("allg.offen");
  if (p <= 0) return t("allg.zu");
  return zeige(p) + " %";
}

function auswahl(feldname, optionen, wert, leer=null){
  const eintraege = leer ? [["", leer], ...optionen] : optionen;
  return `<select name="${feldname}">${eintraege.map(([w, bez]) =>
    `<option value="${esc(w)}" ${String(w) === String(wert ?? "") ? "selected" : ""}>${esc(bez)}</option>`
  ).join("")}</select>`;
}

function hakenliste(feldname, kandidaten, gewaehlt, gruppieren=true){
  if (!kandidaten.length)
    return `<div class="hakenliste kurz"><div class="h-leer">${t("allg.nichts_gefunden")}</div></div>`;
  const gruppen = new Map();
  kandidaten.forEach((k) => {
    const gruppe = gruppieren ? (k.bereich || t("allg.ohne_bereich")) : "";
    if (!gruppen.has(gruppe)) gruppen.set(gruppe, []);
    gruppen.get(gruppe).push(k);
  });
  let html = "";
  for (const [gruppe, liste] of gruppen) {
    if (gruppe) html += `<div class="h-gruppe">${esc(gruppe)}</div>`;
    html += liste.map((k) => {
      const an = gewaehlt.includes(k.entity_id);
      return `<label class="${an ? "an" : ""}">
        <input type="checkbox" name="${feldname}" value="${esc(k.entity_id)}" ${an ? "checked" : ""}>
        <span class="h-text">${esc(k.name)} <span class="h-eid">${esc(k.entity_id)}</span></span>
      </label>`;
    }).join("");
  }
  return `<div class="hakenliste">${html}</div>`;
}

/* ─────────────────────────────────────────── Das Bild: Fenster oder Tür ─── */

function rollobild(position, art){
  const p = Number(position);
  const zu = Number.isNaN(p) ? 100 : Math.max(0, Math.min(100, 100 - p));
  const tuer = TUERARTEN.includes(art);
  return `<div class="bild"><div class="rollo ${tuer ? "tuer" : "fenster"}"
    style="--zu:${zu}%">
    ${tuer ? '<div class="fluegel"></div><div class="griff"></div>' : ""}
    <div class="panzer"></div><div class="kasten"></div>
  </div></div>`;
}

function zeichneUebersicht(){
  const b = BERICHT || {};
  const sonne = b.sonne || {};
  const teile = [];
  if (b.zeit) teile.push(`${t("ue.stand")} <b>${uhrzeit(b.zeit)}</b>`);
  teile.push(t("ue.sonne", {auf: uhrzeit(sonne.aufgang), unter: uhrzeit(sonne.untergang)}));
  if (sonne.elevation !== undefined)
    teile.push(t("ue.hoehe", {hoehe: Math.round(sonne.elevation),
                              azimut: Math.round(sonne.azimut)}));
  if (b.aussen !== null && b.aussen !== undefined) teile.push(t("ue.aussen", {n: b.aussen}));
  if (b.schulfrei !== null && b.schulfrei !== undefined)
    teile.push(t("ue.heute", {was: t(b.schulfrei ? "ue.schulfrei" : "ue.schultag")}));
  if (b.schulfrei_morgen !== null && b.schulfrei_morgen !== undefined)
    teile.push(t("ue.morgen", {was: t(b.schulfrei_morgen ? "ue.schulfrei" : "ue.schule")}));
  if (b.urlaub) teile.push(t("ue.urlaub"));
  if (b.trockenlauf) teile.push(t("ue.trockenlauf"));
  if (b.rauch) teile.push(`${t("ue.rauch")}: ${esc(b.rauch_grund||"")}`);
  $("#lage").innerHTML = teile.map((teil) => `<span>${teil}</span>`).join("");

  const stoerungen = b.stoerungen || [];
  $("#stoerungen-tafel").hidden = stoerungen.length === 0;
  $("#stoerungen").innerHTML = stoerungen.map((s) =>
    `<div class="befund"><span class="art-${s.schwere==="fehler"?"fehler":"warnung"}">
      ${esc(s.text)}</span></div>`).join("");

  const rollos = b.rollos || [];
  if (!rollos.length) {
    $("#uebersicht-rollos").innerHTML = `<div class="tafel"><div class="leerhinweis">
      ${t("ue.leer")}</div></div>`;
    return;
  }
  // Nach Raum ordnen: Der Raum steuert nichts mehr, aber er ist der Ort, an dem
  // man ein Rollo sucht.
  const nachRaum = new Map();
  rollos.forEach((r) => {
    const raum = r.raum || t("allg.ohne_bereich");
    if (!nachRaum.has(raum)) nachRaum.set(raum, []);
    nachRaum.get(raum).push(r);
  });
  // Solange jemand an einem Schieber zieht, wird nicht neu gezeichnet: Die
  // Übersicht erneuert sich alle zwanzig Sekunden von selbst, und ein
  // Schieber, der einem unter dem Finger weggerissen wird, ist unbedienbar.
  if (schieberAktiv()) return;

  // Ein durchgehendes Raster mit Überschriften darin: Ein eigenes Raster je
  // Raum ließe die Kachel eines Einzelrollos über die ganze Breite laufen.
  $("#uebersicht-rollos").innerHTML = `<div class="raumliste">${
    [...nachRaum].map(([raum, liste]) =>
      `<div class="raumtitel">${esc(raum)}</div>` + liste.map(kachel).join("")
    ).join("")}</div>`;

  $$("#uebersicht-rollos [data-fahren]").forEach((el) =>
    el.onclick = () => fahren(el.dataset.fahren, Number(el.dataset.position)));
  $$("#uebersicht-rollos [data-hand]").forEach((el) =>
    el.onclick = () => handbetriebAufheben(el.dataset.hand));
  $$("#uebersicht-rollos [data-stop]").forEach((el) =>
    el.onclick = () => anhalten(el.dataset.stop));
  $$("#uebersicht-rollos [data-schieber]").forEach((el) => {
    // Beim Ziehen nur die Zahl mitführen. Jeder Zwischenwert als Fahrbefehl
    // wäre ein Dutzend Befehle für eine Handbewegung – der Antrieb ruckte,
    // und das Protokoll stünde voll.
    el.oninput = () => {
      SCHIEBER_BIS = Date.now() + 5000;
      el.parentElement.querySelector(".wert").textContent = el.value + " %";
    };
    el.onchange = () => {
      // Nach dem Loslassen etwas Ruhe: Der Antrieb meldet seine neue Stellung
      // erst, wenn er angekommen ist. Ohne die Frist spränge der Schieber
      // beim nächsten Zeichnen auf den alten Wert zurück.
      SCHIEBER_BIS = Date.now() + 15000;
      fahren(el.dataset.schieber, Number(el.value));
    };
  });
}

/* Der Schieber will nicht unter der Hand neu gezeichnet werden – weder
   während man zieht noch, solange das Rollo unterwegs ist. */
let SCHIEBER_BIS = 0;
function schieberAktiv(){
  if (Date.now() < SCHIEBER_BIS) return true;
  const el = document.activeElement;
  return Boolean(el && el.type === "range" && el.closest("#uebersicht-rollos"));
}

async function anhalten(entityId){
  try {
    const r = await holeJSON("api/stop", "POST", {rollo: entityId});
    melden(t(r.gestoppt ? "ka.gestoppt" : "ka.abgelehnt"), !r.gestoppt);
    // Erst nach der Auslaufzeit nachsehen: Vorher meldet der Antrieb noch die
    // Stellung, aus der er gerade kommt.
    setTimeout(aktualisieren, 2500);
  } catch (err) { melden(err.message, true); }
}

function kachel(rollo){
  const zustand = rollo.zustand || "plan";
  const ziel = rollo.ziel;
  const naechster = rollo.naechste_uhrzeit
    ? t("ka.dann", {stellung: stellungstext(rollo.naechste_stellung),
                    zeit: esc(rollo.naechste_uhrzeit)}) : "";
  const hand = zustand === "manuell";
  // Kachel und Schieber zeigen, wo das Rollo **steht** – nicht, wohin der
  // Planer es geschickt hat. Solange beides zusammenfällt, ist das dasselbe;
  // nach einem Halt gehen sie auseinander, und dann ist die wahre Stellung
  // die Auskunft, nach der man sucht. Wohin der Planer will, steht darunter.
  const stand = rollo.ist ?? ziel;
  // 6 ist die TOLERANZ des Planers: Darunter ist eine Abweichung kein
  // Eingriff, sondern der Weg, den ein Antrieb beim Anhalten noch macht.
  const weichtAb = stand !== null && stand !== undefined
    && ziel !== null && ziel !== undefined && Math.abs(stand - ziel) > 6;
  const plan = rollo.plan
    ? `<span class="planschild">${esc(rollo.plan)}</span>`
    : `<span class="planschild eigen">${t("ka.eigener_plan")}</span>`;
  return `<article class="raum ${zustand === "aus" ? "aus" : ""}">
    <div class="raum-kopf">
      ${rollobild(stand, rollo.art)}
      <h3>${esc(rollo.name)}</h3>
      <div class="rechts">
        <span class="raum-ziel">${stand === null || stand === undefined
          ? "–" : zeige(stand)}<small>%</small></span>
        <span class="lage${weichtAb ? " plan" : ""}">${weichtAb
          ? t("ka.plan_ziel", {was: stellungstext(ziel)})
          : stellungstext(stand)}</span>
      </div>
    </div>
    <div style="display:flex; gap:var(--l2); flex-wrap:wrap; align-items:center">
      ${zustandText(zustand) && zustand !== "plan"
        ? `<span class="marke-schild m-${zustand}">${zustandText(zustand)}</span>` : ""}
      ${plan}
    </div>
    <p class="raum-grund">${esc(rollo.begruendung || "")}</p>
    ${rollo.kann_stellung === false ? "" : `<div class="raum-schieber">
      <input type="range" min="0" max="100" step="5" value="${zeige(stand ?? 0)}"
             title="${t("ka.schieber_titel")}" data-schieber="${esc(rollo.entity_id)}">
      <span class="wert">${zeige(stand ?? 0)} %</span>
    </div>`}
    <div class="raum-fuss">
      <span style="flex:1">${naechster}</span>
      <button class="leise" data-fahren="${esc(rollo.entity_id)}" data-position="100">${t("ka.auf")}</button>
      ${rollo.kann_stop === false ? "" : `<button class="leise halt"
        data-stop="${esc(rollo.entity_id)}" title="${t("ka.halt_titel")}"
        >${t("ka.halt")}</button>`}
      <button class="leise" data-fahren="${esc(rollo.entity_id)}" data-position="0">${t("ka.zu")}</button>
      ${hand ? `<button class="leise" data-hand="${esc(rollo.entity_id)}">${t("ka.hand_aufheben")}</button>` : ""}
    </div>
  </article>`;
}

async function fahren(entityId, position){
  try {
    await holeJSON("api/fahren", "POST", {rollo: entityId, position: lies(position)});
    melden(t("ka.gefahren"));
    setTimeout(aktualisieren, 1200);
  } catch (err) { melden(err.message, true); }
}

async function handbetriebAufheben(entityId){
  try {
    const r = await holeJSON(`api/handbetrieb?rollo=${encodeURIComponent(entityId)}`, "DELETE");
    melden(t("hb.aufgehoben", {n: r.aufgehoben}));
    setTimeout(aktualisieren, 900);
  } catch (err) { melden(err.message, true); }
}

/* ─────────────────────────────────────────── Der Schaltpunkt-Editor ─── */
/* Rollo-Dialog und Zeitplan-Dialog teilen ihn sich: Ein Schaltpunkt ist
   dasselbe, egal wem der Plan gehört. */

function bedingungsKandidaten(){
  const e = ENTITAETEN || {};
  const eigene = (CONFIG?.einstellungen?.eigene_schalter || [])
    .map((k) => ["rolloplaner:" + k.id, `${k.name} (Rolloplaner)`]);
  return [...eigene, ...(e.auswahl || []).map((k) => [k.entity_id, k.name]),
          ...(e.schalter || []).map((k) => [k.entity_id, k.name]),
          ...(e.sonstige_melder || []).map((k) => [k.entity_id, k.name])];
}

function werteFuer(entity){
  const id = String(entity || "").startsWith("rolloplaner:")
    ? entity.slice("rolloplaner:".length) : null;
  if (!id) return null;
  const k = (CONFIG?.einstellungen?.eigene_schalter || []).find((x) => x.id === id);
  if (!k) return null;
  return k.art === "auswahl" ? k.optionen : ["on", "off"];
}

function werteListe(){
  const werte = new Set(["on", "off"]);
  ((ENTITAETEN || {}).auswahl || []).forEach((k) =>
    (k.optionen || []).forEach((o) => werte.add(o)));
  return `<datalist id="werte-liste">${[...werte].map((w) =>
    `<option value="${esc(w)}">`).join("")}</datalist>`;
}

function punktZeile(punkt, index){
  const sonne = punkt.ausloeser !== "uhrzeit";
  return `<div class="punkt-zeile" data-punkt="${index}">
    ${auswahl(`p${index}_ausloeser`, AUSLOESER(), punkt.ausloeser)}
    <input type="${sonne ? "number" : "time"}" name="p${index}_start"
           value="${sonne ? (punkt.versatz_min || 0) : esc(punkt.start || "")}"
           ${sonne ? `step="5" min="-180" max="180" title="${t("pk.versatz_titel")}"` : ""}>
    <div style="display:flex; gap:4px; align-items:center">
      <input type="time" name="p${index}_frueh" value="${esc(punkt.frueh || "")}"
             title="${t("pk.frueh_titel")}" ${sonne ? "" : "disabled"}>
      <input type="time" name="p${index}_spaet" value="${esc(punkt.spaet || "")}"
             title="${t("pk.spaet_titel")}" ${sonne ? "" : "disabled"}>
    </div>
    <div style="display:flex; gap:4px; align-items:center">
      <input type="number" name="p${index}_position" value="${zeige(punkt.position)}"
             min="0" max="100" step="5" title="${t("pk.stellung_titel")}" style="max-width:74px">
      ${auswahl(`p${index}_gilt`, GELTUNG(), punkt.gilt)}
    </div>
    <button type="button" class="leise gefahr" data-punkt-weg="${index}">×</button>
    <div class="tagewahl" style="grid-column:1/-1">
      ${TAGE().map(([w, kurz]) => `<label>
        <input type="checkbox" name="p${index}_tage" value="${w}"
               ${(punkt.tage || []).includes(w) ? "checked" : ""}><span>${kurz}</span></label>`).join("")}
    </div>
    ${(punkt.wenn || []).map((bedingung, j) => `<div class="wennzeile">
      <span>${t("pk.nur_wenn")}</span>
      ${auswahl(`p${index}_w${j}_entity`, bedingungsKandidaten(), bedingung.entity)}
      <span>=</span>
      ${(() => { const werte = werteFuer(bedingung.entity);
        return werte
          ? auswahl(`p${index}_w${j}_wert`, werte.map((w) => [w, w]), bedingung.wert)
          : `<input type="text" name="p${index}_w${j}_wert" value="${esc(bedingung.wert)}"
               list="werte-liste" placeholder="on">`; })()}
      <button type="button" class="leise gefahr w-weg" data-wenn-weg="${index}:${j}">×</button>
    </div>`).join("")}
    <div class="wennzeile">
      <button type="button" class="leise" data-wenn-neu="${index}">${t("pk.bedingung_neu")}</button>
      ${(punkt.wenn || []).length ? "" : `<span class="hinweis" style="margin:0">
        ${t("pk.ohne_bedingung")}</span>`}

}

function punktliste(punkte){
  return `<div class="punktliste" id="punktliste">
    ${punkte.length ? `<div class="punkt-kopf">
      <span>${t("pk.kopf_ausloeser")}</span><span>${t("pk.kopf_zeit")}</span>

const WERKTAGE = ["mon","tue","wed","thu","fri"];
const ALLE = TAGCODES;
const punkt = (position, ausloeser="uhrzeit", start="", rest={}) => ({
  ausloeser, start, versatz_min:0, frueh:"", spaet:"", position, wenn:[],
  gilt:"immer", tage:ALLE, name:"", ...rest});
const VORLAGEN = {
  wohnraum: [punkt(100,"uhrzeit","06:30",{gilt:"schultag",tage:WERKTAGE}),
             punkt(100,"uhrzeit","10:00",{gilt:"schulfrei"}),
             punkt(0,"sonnenuntergang","",{spaet:"23:00"})],
  kinderzimmer: [punkt(100,"uhrzeit","06:30",{gilt:"schultag",tage:WERKTAGE}),
                 punkt(100,"uhrzeit","10:00",{gilt:"schulfrei"}),
                 punkt(0,"sonnenuntergang","",{spaet:"20:30",gilt:"morgen_schultag"}),
                 punkt(0,"sonnenuntergang","",{spaet:"22:00",gilt:"morgen_schulfrei"})],
  schlafzimmer: [punkt(100,"uhrzeit","07:00",{gilt:"schultag",tage:WERKTAGE}),
                 punkt(100,"uhrzeit","09:00",{gilt:"schulfrei"}),
                 punkt(0,"sonnenuntergang","",{spaet:"22:30"})],
  buero: [punkt(100,"sonnenaufgang","",{frueh:"08:30",tage:WERKTAGE}),
          punkt(100,"sonnenaufgang","",{frueh:"10:00",tage:["sat","sun"]}),
          punkt(0,"sonnenuntergang","",{spaet:"23:00"})],
};

function punktKnoepfe(neuZeichnen){
  const knopf = $("#btn-punkt-neu");
  if (knopf) knopf.onclick = () => {
    sammleDialog();
    ENTWURF.zeitplan.push(punkt(100, "uhrzeit", "07:00"));
    neuZeichnen();
  };
  $$("#dlg-inhalt [data-punkt-weg]").forEach((el) => el.onclick = () => {
    sammleDialog();
    ENTWURF.zeitplan.splice(Number(el.dataset.punktWeg), 1);
    neuZeichnen();
  });
  $$("#dlg-inhalt [data-wenn-neu]").forEach((el) => el.onclick = () => {
    sammleDialog();
    const p = ENTWURF.zeitplan[Number(el.dataset.wennNeu)];
    (p.wenn = p.wenn || []).push({entity: "", wert: "on"});
    neuZeichnen();
  });
  $$("#dlg-inhalt [data-wenn-weg]").forEach((el) => el.onclick = () => {
    sammleDialog();
    const [i, j] = el.dataset.wennWeg.split(":").map(Number);
    ENTWURF.zeitplan[i].wenn.splice(j, 1);
    neuZeichnen();
  });
  $$("#dlg-inhalt select[name$='_ausloeser']").forEach((el) =>
    el.onchange = () => { sammleDialog(); neuZeichnen(); });
  $$("#dlg-inhalt select[name*='_w'][name$='_entity']").forEach((el) =>
    el.onchange = () => { sammleDialog(); neuZeichnen(); });
  const vorlage = $("#dlg-inhalt select[name=vorlage]");
  if (vorlage) vorlage.onchange = () => {
    if (!vorlage.value) return;
    sammleDialog();
    ENTWURF.zeitplan = VORLAGEN[vorlage.value].map((p) => ({...p}));
    neuZeichnen();
  };
}

/* Die Schaltpunkte aus dem Formular zurücklesen. Die Bedingungen stehen in
   eigenen Zeilen und müssen mit eingesammelt werden – sonst wäre jedes
   Speichern ein stiller Verlust. */
function punkteSammeln(wurzel){
  const wert = (name) => { const el = wurzel.querySelector(`[name="${name}"]`);
                           return el ? el.value : ""; };
  return $$("#punktliste .punkt-zeile", wurzel).map((zeile) => {
    const i = zeile.dataset.punkt;
    const ausloeser = wert(`p${i}_ausloeser`);
    const rohstart = wert(`p${i}_start`);
    const wenn = $$(`.wennzeile [name^="p${i}_w"]`, zeile)
      .filter((el) => el.name.endsWith("_entity"))
      .map((el) => ({entity: el.value,
                     wert: (wurzel.querySelector(
                       `[name="${el.name.replace("_entity", "_wert")}"]`) || {}).value || ""}))
      .filter((b) => b.entity);
    return {
      wenn,
      ausloeser,
      start: ausloeser === "uhrzeit" ? rohstart : "",
      versatz_min: ausloeser === "uhrzeit" ? 0 : (Number(rohstart) || 0),
      frueh: wert(`p${i}_frueh`), spaet: wert(`p${i}_spaet`),
      position: lies(Number(wert(`p${i}_position`))),
      gilt: wert(`p${i}_gilt`),
      tage: $$(`[name="p${i}_tage"]:checked`, wurzel).map((el) => el.value),
      name: "",
    };
  });
}

function zeichneRollos(){
  const rollos = CONFIG?.rollos || [];
  const plaene = new Map((CONFIG?.plaene || []).map((p) => [p.id, p]));

  if (!rollos.length) {
    $("#rolloliste").innerHTML = `<div class="leerhinweis">${t("rl.leer")}</div>`;

  rollos.forEach((r) => {

    nachRaum.get(raum).push(r);

  // **Eine** Tabelle mit Raum-Zwischenzeilen, nicht eine Tabelle je Raum: Sonst
  // wiederholt sich die Kopfzeile bei jedem Raum, und weil jede Tabelle ihre
  // Spalten selbst ausmisst, springen die Spaltenbreiten von Raum zu Raum.
  $("#rolloliste").innerHTML = `<table>
    <thead><tr><th>${t("rl.rollo")}</th><th>${t("rl.was")}</th>
      <th>${t("rl.plan")}</th><th>${t("rl.hitze")}</th>
      <th></th></tr></thead>
    <tbody>${[...nachRaum].map(([raum, liste]) => `
      <tr class="raumzeile"><td colspan="5">${esc(raum)}</td></tr>

            <div class="hinweis">${esc(r.entity_id)}</div></td>
          <td>${esc(artName.get(r.art) || r.art)}</td>
          <td>${r.betriebsart === "von_hand"
                ? `<span class="planschild eigen">${t("rl.nur_hand")}</span>`

          <td class="hinweis">${r.beschattung && r.ausrichtung !== null

/* ──────────────────────────────────────────────────────────── Zeitpläne ─── */

function zeichnePlaene(){
  const plaene = CONFIG?.plaene || [];
  const rollos = CONFIG?.rollos || [];
  // Auch die Rollos mit **eigenem** Zeitplan gehören hierher. Wer den Reiter
  // „Zeitpläne“ öffnet, sucht alle – und nicht nur die, die sich mehrere
  // teilen. Sonst wäre der Zeitplan des Büros nur über den Umweg Rollos →
  // Bearbeiten zu finden.
  const eigene = rollos.filter((r) => !r.plan && (r.zeitplan || []).length);
  const ohne = rollos.filter((r) => !r.plan && !(r.zeitplan || []).length);

  const gemeinsam = plaene.length ? `<table>
    <thead><tr><th>${t("zp.plan")}</th><th>${t("zp.punkte")}</th>
      <th>${t("zp.gilt_fuer")}</th><th></th></tr></thead>
    <tbody>${plaene.map((p) => {
      const folger = rollos.filter((r) => r.plan === p.id);
      return `<tr>
        <td><b>${esc(p.name)}</b>${p.aktiv ? ""
          : ` <span class="hinweis">${t("zp.aus")}</span>`}</td>
        <td>${p.zeitplan.length}</td>
        <td class="hinweis">${folger.length
          ? folger.map((r) => esc(rolloName(r))).join(", ")
          : t("zp.niemand")}</td>
        <td class="knopfspalte"><button class="leise" data-plan="${p.id}">${t("zp.bearbeiten")}</button></td>
      </tr>`;
    }).join("")}</tbody></table>`
    : `<div class="leerhinweis">${t("zp.leer")}</div>`;

  const eigenteil = eigene.length ? `
    <div class="abschnitt" style="margin-top:var(--l5)">
      <h3>${t("zp.eigene")}</h3>
      <p class="hinweis" style="margin-bottom:var(--l3)">${t("zp.eigene_hinweis")}</p>
      <table><tbody>${eigene.map((r) => `<tr>
        <td><b>${esc(rolloName(r))}</b>
          <div class="hinweis">${esc(r.raum || "")}</div></td>
        <td>${t("zp.n_punkte", {n: r.zeitplan.length})}</td>
        <td class="knopfspalte">
          <button class="leise" data-rollo-plan="${esc(r.entity_id)}">${t("zp.bearbeiten")}</button></td>
      </tr>`).join("")}</tbody></table>
    </div>` : "";

  const ohneteil = ohne.length ? `
    <div class="abschnitt" style="margin-top:var(--l5)">
      <h3>${t("zp.ohne")}</h3>
      <table><tbody>${ohne.map((r) => `<tr>
        <td><b>${esc(rolloName(r))}</b>
          <div class="hinweis">${esc(r.raum || "")}</div></td>
        <td class="hinweis">${r.betriebsart === "von_hand"
          ? t("zp.von_hand_gewollt")

          <button class="leise" data-rollo-plan="${esc(r.entity_id)}">${t("zp.bearbeiten")}</button></td>
      </tr>`).join("")}</tbody></table>
    </div>` : "";

  $("#planliste").innerHTML = gemeinsam + eigenteil + ohneteil;
  $$("#planliste [data-plan]").forEach((el) =>
    el.onclick = () => planDialog(plaene.find((p) => p.id === el.dataset.plan)));
  $$("#planliste [data-rollo-plan]").forEach((el) =>
    el.onclick = () => rolloDialog(rollos.find((r) => r.entity_id === el.dataset.rolloPlan)));
}

/* ───────────────────────────────────────────────── Dialog: gemeinsam ─── */

function sammleDialog(){
  const wurzel = $("#dlg-inhalt");
  const r = ENTWURF;
  const wert = (name) => { const el = wurzel.querySelector(`[name="${name}"]`);
                           return el ? el.value : ""; };
  const haken = (name) => { const el = wurzel.querySelector(`[name="${name}"]`);
                            return el ? el.checked : false; };
  const mehrfach = (name) => $$(`[name="${name}"]:checked`, wurzel).map((el) => el.value);

  r.name = wert("name");
  r.aktiv = haken("aktiv");

  if (DIALOGART === "plan") {
    r.zeitplan = punkteSammeln(wurzel);
    return;
  }

  if (!r.entity_id) r.entity_id = wert("entity_id");
  r.raum = wert("raum");
  r.art = wert("art");
  r.betriebsart = wert("betriebsart");
  r.plan = wert("plan");
  r.zeitplan = r.plan ? [] : punkteSammeln(wurzel);
  r.ausrichtung = wert("ausrichtung") === "" ? null : Number(wert("ausrichtung"));
  r.oeffnungswinkel = Number(wert("oeffnungswinkel")) || 90;
  r.beschattung = haken("beschattung");
  r.beschattung_position = wert("beschattung_position") === "" ? null
    : lies(Number(wert("beschattung_position")));
  r.raumtemp = wert("raumtemp");
  r.raumtemp_ab = wert("raumtemp_ab") === "" ? null : Number(wert("raumtemp_ab"));
  r.fenster = mehrfach("fenster");
  r.urlaub_simulation = haken("urlaub_simulation");
  r.fluchtweg = haken("fluchtweg");
  r.position_offen = lies(Number(wert("position_offen")));
  r.position_zu = lies(Number(wert("position_zu")));
}

async function dialogSpeichern(){
  sammleDialog();
  const r = ENTWURF;
  try {
    if (DIALOGART === "plan") {
      if (r.id) await holeJSON(`api/plaene/${r.id}`, "PUT", r);
      else await holeJSON("api/plaene", "POST", r);
    } else {
      if (!r.entity_id) throw new Error(t("dl.rollo_waehlen"));
      const vorhanden = (CONFIG?.rollos || []).some((x) => x.entity_id === r.entity_id);
      if (vorhanden) await holeJSON(`api/rollos/${encodeURIComponent(r.entity_id)}`, "PUT", r);
      else await holeJSON("api/rollos", "PUT",
                          {rollos: [...(CONFIG?.rollos || []), r]});
    }
    $("#dialog").close();
    melden(t("allg.gespeichert"));
    await aktualisieren();
  } catch (err) {
    $("#dlg-fehler").innerHTML = `<div class="fehler">${esc(err.message)}</div>`;
    $("#dlg-inhalt").scrollTop = 0;
  }
}

async function dialogLoeschen(){
  const r = ENTWURF;
  const was = DIALOGART === "plan" ? t("dl.den_plan", {name: r.name})
                                   : t("dl.das_rollo", {name: rolloName(r)});
  if (!confirm(t("dl.frage", {was}))) return;
  try {
    if (DIALOGART === "plan") await holeJSON(`api/plaene/${r.id}`, "DELETE");
    else await holeJSON(`api/rollos/${encodeURIComponent(r.entity_id)}`, "DELETE");
    $("#dialog").close(); melden(t("dl.geloescht")); await aktualisieren();
  } catch (err) {
    $("#dlg-fehler").innerHTML = `<div class="fehler">${esc(err.message)}</div>`;
  }
}

    if (el.dataset.feld === "optionen") {

/* Wie `auswahl`, aber für die Tabellenzeilen mit Index. */
function auswahl2(feld, i, optionen, wert){
  return `<select data-feld="${feld}" data-i="${i}">${optionen.map(([w, bez]) =>
    `<option value="${esc(w)}" ${String(w) === String(wert ?? "") ? "selected" : ""}
     >${esc(bez)}</option>`).join("")}</select>`;
}

async function ladeSchalter(){
  try { SCHALTER = await hole("api/schalter"); }
  catch (err) { melden(err.message, true); SCHALTER = []; }
  zeichneSchalter();
  zeichneFremde();
}

/* Welche fremden Helfer stecken noch in den Zeitplänen? */
function zeichneFremde(){
  const fremde = new Map();
  const quellen = [...(CONFIG?.rollos || []).map((r) => [r.name || r.entity_id, r.zeitplan]),
                   ...(CONFIG?.plaene || []).map((p) => [t("fr.zeitplan", {name: p.name}), p.zeitplan])];
  for (const [wo, punkte] of quellen) {
    const merken = (e) => {
      if (!e || e.startsWith("rolloplaner:")) return;
      if (!fremde.has(e)) fremde.set(e, []);
      if (!fremde.get(e).includes(wo)) fremde.get(e).push(wo);
    };
    (punkte || []).forEach((p) => (p.wenn || []).forEach((b) => merken(b.entity)));
  }
  if (!fremde.size) {
    $("#fremde").innerHTML = `<div class="leerhinweis">${t("fr.alles_eigen")}</div>`;
    return;
  }
  $("#fremde").innerHTML = `<p class="hinweis" style="margin-bottom:var(--l3)">
      ${t("fr.hinweis")}</p>
    <table><tbody>${[...fremde].map(([e, wo]) => `<tr>
      <td><code>${esc(e)}</code></td>
      <td class="hinweis">${esc(wo.join(", "))}</td>
    </tr>`).join("")}</tbody></table>
    <div style="margin-top:var(--l4)">
      <button id="btn-fremde-ersetzen">${t("fr.ersetzen")}</button>
    </div>`;
  $("#btn-fremde-ersetzen").onclick = async () => {
    if (!confirm(t("fr.frage"))) return;
    try {
      const r = await holeJSON("api/schalter/uebernehmen", "POST");
      melden(r.hinweis || t("fr.angelegt", {n: r.angelegt}));
      await aktualisieren();
      await ladeSchalter();
    } catch (err) { melden(err.message, true); }
  };
}

function rolloNameVon(eid){
  const r = (BERICHT?.rollos || []).find((x) => x.entity_id === eid);
  if (r) return r.name;
  const k = (CONFIG?.rollos || []).find((x) => x.entity_id === eid);
  return (k && k.name) || eid;
}

              <div class="hinweis">${esc(eid)}</div></div>
            <div class="g-pfeile">
              <button class="leise" data-r-hoch="${i}:${j}" ${j ? "" : "disabled"}>↑</button>

            Liste unten sogar ganz – dann führte gar kein Weg mehr hierher. */

            }).join("")}

      <div class="dlg-fuss" style="padding-left:0; padding-right:0">
        <button class="leise" data-g-hoch="${i}" ${i ? "" : "disabled"}>${t("gr.hoch")}</button>
        <button class="leise" data-g-runter="${i}"
                ${i === GRUPPEN.length - 1 ? "disabled" : ""}>${t("gr.runter")}</button>
        <button class="leise art-warnung" data-g-weg="${i}">${t("gr.weg")}</button>
      </div>

  if (frei.length) {
    html += `<div class="abschnitt"><h3>${t("gr.ohne")}</h3>
      ${frei.map((eid) => `<div class="gruppenzeile">
        <div class="g-name"><b>${esc(rolloNameVon(eid))}</b>
          <div class="hinweis">${esc(eid)}</div></div>
        <select data-frei-ziel="${esc(eid)}">

        </select></div>`).join("")}

  if (!GRUPPEN.length && !frei.length) {
    html = `<p class="leerhinweis">${t("gr.keine")}</p>`;
  }
  $("#gruppen").innerHTML = html;
  gruppenVerdrahten();
}

function gruppenVerdrahten(){
  const wurzel = $("#gruppen");
  $$("[data-g-feld]", wurzel).forEach((el) => {
    el.onchange = () => {
      const g = GRUPPEN[Number(el.dataset.i)];
      g[el.dataset.gFeld] = el.type === "checkbox" ? el.checked : el.value;
      if (el.dataset.gFeld !== "name") zeichneGruppen();
    };
  });
  const tausch = (liste, a, b) => { const t = liste[a]; liste[a] = liste[b]; liste[b] = t; };
  $$("[data-r-hoch]", wurzel).forEach((el) => el.onclick = () => {
    const [i, j] = el.dataset.rHoch.split(":").map(Number);
    tausch(GRUPPEN[i].rollos, j, j - 1); zeichneGruppen();
  });
  $$("[data-r-runter]", wurzel).forEach((el) => el.onclick = () => {
    const [i, j] = el.dataset.rRunter.split(":").map(Number);
    tausch(GRUPPEN[i].rollos, j, j + 1); zeichneGruppen();
  });
  $$("[data-r-ziel]", wurzel).forEach((el) => el.onchange = () => {
    const [i, j] = el.dataset.rZiel.split(":").map(Number);
    const [eid] = GRUPPEN[i].rollos.splice(j, 1);
    if (el.value !== "-") GRUPPEN[Number(el.value)].rollos.push(eid);
    zeichneGruppen();
  });
  $$("[data-g-dazu]", wurzel).forEach((el) => el.onchange = () => {
    if (!el.value) return;
    const ziel = Number(el.dataset.gDazu);
    // Ein Rollo gehört in höchstens eine Gruppe – also erst überall
    // herausnehmen, dann hier einhängen. Sonst stünde es in zweien, und der
    // Planer wüsste nicht, welcher Zeitplan gilt.
    GRUPPEN.forEach((g) => {
      const k = g.rollos.indexOf(el.value);
      if (k >= 0) g.rollos.splice(k, 1);
    });
    GRUPPEN[ziel].rollos.push(el.value);
    zeichneGruppen();
  });
  $$("[data-frei-ziel]", wurzel).forEach((el) => el.onchange = () => {
    if (el.value === "") return;
    GRUPPEN[Number(el.value)].rollos.push(el.dataset.freiZiel);
    zeichneGruppen();
  });
  $$("[data-g-hoch]", wurzel).forEach((el) => el.onclick = () => {
    const i = Number(el.dataset.gHoch); tausch(GRUPPEN, i, i - 1); zeichneGruppen();
  });
  $$("[data-g-runter]", wurzel).forEach((el) => el.onclick = () => {
    const i = Number(el.dataset.gRunter); tausch(GRUPPEN, i, i + 1); zeichneGruppen();
  });
  $$("[data-g-weg]", wurzel).forEach((el) => el.onclick = () => {
    const g = GRUPPEN[Number(el.dataset.gWeg)];
    // Die Rollos bleiben – sie stehen danach unter „Noch in keiner Gruppe".
    if (confirm(t("gr.loeschen_frage", {name: g.name, n: g.rollos.length}))) {
      GRUPPEN.splice(Number(el.dataset.gWeg), 1); zeichneGruppen();
    }
  });
}

    GRUPPEN = null;
    await aktualisieren();

  const jetzt = b.rauch
    ? `<p class="hinweis art-fehler">${t("ra.alarm_laeuft")}

    </div>
    ${jetzt}
    ${ausgenommen.length ? `<p class="hinweis">${t("ra.ausgenommen")}
      <b>${ausgenommen.map((x) => esc(rolloName(x))).join(", ")}</b></p>` : ""}
  </div>

  <div class="abschnitt"><h3>${t("ra.sperre")}</h3>
    <label class="haken"><input type="checkbox" name="rauchsperre.aktiv"
      ${r.aktiv ? "checked" : ""}>
      ${t("ra.sperre_haken")}</label>
    <p class="hinweis">${t("ra.sperre_hinweis")}</p>
    <label class="feld" style="margin-top:var(--l3)"><span>${t("ra.nachlauf")}</span>
      <input type="number" name="rauchsperre.nachlauf_min" value="${r.nachlauf_min}"
             min="0" max="720" step="5" style="max-width:160px"></label>
    <p class="hinweis">${t("ra.nachlauf_hinweis")}</p>
  </div>

  <div class="abschnitt"><h3>${t("ra.freigabe")}</h3>
    <label class="haken"><input type="checkbox" name="rauchsperre.fluchtweg"
      ${r.fluchtweg ? "checked" : ""}>
      ${t("ra.freigabe_haken")}</label>
    <p class="hinweis">${t("ra.freigabe_hinweis")}</p>
    <label class="feld" style="margin-top:var(--l3)"><span>${t("ra.versuche")}</span>
      <input type="number" name="rauchsperre.fluchtweg_versuche"
             value="${r.fluchtweg_versuche ?? 3}" min="1" max="10" step="1"
             style="max-width:160px"></label>
    <p class="hinweis">${t("ra.versuche_hinweis")}</p>
  </div>

  <div class="abschnitt"><h3>${t("ra.melder")}</h3>
    <label class="feld"><span>${t("ra.melder_titel")}</span></label>
    ${hakenliste("rauchsperre.melder", k.rauch || [], r.melder || [])}
    <p class="hinweis">${t("ra.melder_hinweis")}</p>
  </div>

  <div class="abschnitt"><h3>${t("ra.weg")}</h3>
    <label class="feld"><span>${t("ra.weg_titel")}</span></label>
    ${hakenliste("rauchsperre.melden_an",
                 (k.notify || []).map((n) => ({entity_id: n.entity_id, name: n.name})),
                 r.melden_an || [], false)}
    <p class="hinweis">${t("ra.weg_hinweis1")}</p>
    <p class="hinweis">${t("ra.weg_hinweis2")}${wachhundweg.length
        ? `${t("ra.weg_zurzeit")} <b>${esc(wachhundweg.join(", "))}</b>`
        : t("ra.weg_keiner")}. ${t("ra.weg_hinweis3")}</p>

async function rauchalarmSpeichern(){
  const wurzel = $("#rauchalarm");
  const r = {};
  $$("input", wurzel).forEach((el) => {
    if (!el.name || !el.name.startsWith("rauchsperre.")) return;
    const feld = el.name.slice("rauchsperre.".length);
    if (feld === "melder" || feld === "melden_an") return;
    r[feld] = el.type === "checkbox" ? el.checked
            : el.value === "" ? null : Number(el.value);
  });
  // Hakenlisten sind viele Kästchen unter einem Namen – die Schleife oben
  // machte daraus ein einzelnes Ja/Nein.
  for (const feld of ["melder", "melden_an"]) {
    r[feld] = $$('input[name="rauchsperre.' + feld + '"]:checked', wurzel)
      .map((el) => el.value);
  }
  try {
    await holeJSON("api/einstellungen", "PUT", {rauchsperre: r});
    melden(t("allg.gespeichert"));
    await aktualisieren();
  } catch (err) { melden(err.message, true); }
}

async function einstellungenSpeichern(){
  const wurzel = $("#einstellungen");
  const daten = {};
  const setzen = (pfad, wert) => {
    const teile = pfad.split(".");
    let ziel = daten;
    teile.slice(0, -1).forEach((t) => { ziel[t] = ziel[t] || {}; ziel = ziel[t]; });
    ziel[teile.at(-1)] = wert;
  };
  $$("input,select", wurzel).forEach((el) => {
    if (!el.name) return;
    if (el.type === "checkbox") setzen(el.name, el.checked);
    else if (el.type === "number") setzen(el.name, el.value === "" ? null : Number(el.value));
    else setzen(el.name, el.value);
  });
  if (daten.wachhund) daten.wachhund.melden_an =
    daten.wachhund.melden_an ? [daten.wachhund.melden_an] : [];
  // Die Beschattungsstellung wurde in der angezeigten Zählweise eingegeben.
  // Achtung: Wird der Schalter im selben Zug umgelegt, gilt für die Eingabe
  // noch die alte Zählweise – deshalb hier `invertiert()` und nicht der neue
  // Wert aus dem Formular.
  if (daten.beschattung && daten.beschattung.position !== null
      && daten.beschattung.position !== undefined) {
    daten.beschattung.position = invertiert()
      ? 100 - daten.beschattung.position : daten.beschattung.position;
  }
  try {
    await holeJSON("api/einstellungen", "PUT", daten);
    melden(t("allg.gespeichert"));
    await aktualisieren();
  } catch (err) { melden(err.message, true); }
}

let VORSCHLAG = null;

async function ladeVorschlag(){
  try { VORSCHLAG = await hole("api/uebernahme"); }
  catch (err) { $("#vorschlag").innerHTML = `<div class="fehler">${esc(err.message)}</div>`; return; }

  const rollos = VORSCHLAG.rollos || [];
  const plaene = new Map((VORSCHLAG.plaene || []).map((p) => [p.id, p]));
  const offen = rollos.filter((r) => !r.schon_da);
  const zaehler = $("#z-einrichtung");
  zaehler.hidden = offen.length === 0;
  zaehler.textContent = offen.length;

  if (!rollos.length) {
    $("#vorschlag").innerHTML = `<div class="leerhinweis">${t("ev.keine_rollos")}</div>`;
    return;
  }

  const artName = new Map(ARTEN());
  const zeile = (p) => {
    const wann = p.ausloeser === "uhrzeit" ? t("ev.uhr", {zeit: esc(p.start)})
      : esc(AUSLOESER().find(([w]) => w === p.ausloeser)?.[1] || p.ausloeser)
        + (p.versatz_min ? ` ${p.versatz_min > 0 ? "+" : ""}${p.versatz_min} min` : "")
        + (p.frueh ? t("ev.ab", {zeit: esc(p.frueh)}) : "")
        + (p.spaet ? t("ev.bis", {zeit: esc(p.spaet)}) : "");
    const wenn = (p.wenn || []).map((b) =>
      `${esc(b.entity.split(".").at(-1))} = ${esc(b.wert)}`).join(", ");
    return `<tr><td class="zeit">${wann}</td>
      <td>${stellungstext(p.position)}</td>
      <td>${esc(GELTUNG().find(([w]) => w === p.gilt)?.[1] || p.gilt)}</td>
      <td class="hinweis">${p.tage.length === 7 ? t("ev.taeglich")
        : p.tage.map((tag) => TAGE().find(([w]) => w === tag)?.[1]).join(" ")}</td>
      <td class="hinweis">${wenn}</td></tr>`;
  };

  // Nach Raum ordnen – so, wie man ein Rollo sucht.
  const nachRaum = new Map();
  rollos.forEach((r) => {
    const raum = r.raum || t("allg.ohne_bereich");
    if (!nachRaum.has(raum)) nachRaum.set(raum, []);
    nachRaum.get(raum).push(r);
  });

  $("#vorschlag").innerHTML = `
    <div class="abschnitt"><h3>${t("ev.rollos")}</h3>
      ${[...nachRaum].map(([raum, liste]) => `
        <div class="raumtitel">${esc(raum)}</div>
        <table><tbody>${liste.map((r) => {
          const plan = plaene.get(r.plan);
          return `<tr>
            <td style="width:1%"><label class="haken" style="margin:0">
              <input type="checkbox" name="v" value="${esc(r.entity_id)}"
                     ${r.schon_da ? "" : "checked"}></label></td>
            <td><b>${esc(r.anzeige)}</b>
              <div class="hinweis">${esc(r.entity_id)}</div>
              ${(r.hinweise || []).map((h) =>
                `<div class="hinweis art-warnung">${esc(h)}</div>`).join("")}</td>
            <td>${esc(artName.get(r.art) || r.art)}</td>
            <td>${plan ? `<span class="planschild">${esc(plan.name)}</span>`
                  : r.zeitplan.length ? `<span class="planschild eigen">${t("rl.eigene_punkte", {n: r.zeitplan.length})}</span>`
                  : `<span class="hinweis">${t("ev.kein_plan")}</span>`}</td>
            <td class="hinweis">${(r.quellen || []).join("; ")}</td>
          </tr>${!plan && r.zeitplan.length ? `<tr><td></td><td colspan="4">
            <table><tbody>${r.zeitplan.map(zeile).join("")}</tbody></table></td></tr>` : ""}`;
        }).join("")}</tbody></table>`).join("")}
    </div>

    ${VORSCHLAG.plaene?.length ? `<div class="abschnitt"><h3>${t("ev.plaene")}</h3>
      <p class="hinweis" style="margin-bottom:var(--l3)">${t("ev.plaene_hinweis")}</p>
      ${VORSCHLAG.plaene.map((p) => {
        const folger = rollos.filter((r) => r.plan === p.id).map((r) => r.anzeige);
        return `<div style="margin-bottom:var(--l4)">
          <b>${esc(p.name)}</b> <span class="hinweis">— ${folger.map(esc).join(", ")}</span>
          <table><tbody>${p.zeitplan.map(zeile).join("")}</tbody></table></div>`;
      }).join("")}</div>` : ""}

    <div style="display:flex; gap:var(--l2); flex-wrap:wrap; margin-top:var(--l4);
                align-items:center">
      <button id="btn-uebernehmen">${t("ev.uebernehmen")}</button>
      <label class="haken" style="margin:0">
        <input type="checkbox" id="eigene-schalter" checked>
        ${t("ev.eigene_schalter")}</label>
    </div>

    ${VORSCHLAG.ungedeutet?.length ? `<div class="abschnitt" style="margin-top:var(--l5)">
      <h3>${t("ev.bleibt")}</h3>
      ${VORSCHLAG.ungedeutet.map((u) => `<div class="hinweis">
        <b>${esc(u.alias)}</b> – ${esc(u.grund)}</div>`).join("")}
      <p class="hinweis" style="margin-top:var(--l2)">${t("ev.bleibt_hinweis")}</p>
      </div>` : ""}`;

  $("#btn-uebernehmen").onclick = async () => {
    const gewaehlt = new Set($$("#vorschlag [name=v]:checked").map((el) => el.value));
    const auswahl = rollos.filter((r) => gewaehlt.has(r.entity_id));
    if (!auswahl.length) { melden(t("ev.nichts_gewaehlt"), true); return; }
    if (!confirm(t("ev.frage", {n: auswahl.length}))) return;
    try {
      const r = await holeJSON("api/uebernahme", "POST", {
        rollos: auswahl, plaene: VORSCHLAG.plaene,
        eigene_schalter: $("#eigene-schalter").checked});
      melden(t("ev.fertig", {rollos: r.rollos, plaene: r.plaene, schalter: r.schalter}));
      await aktualisieren();
      await ladeVorschlag();
      await ladeGesundheit();
    } catch (err) { melden(err.message, true); }
  };
}

async function aktualisieren(){
  try {
    [CONFIG, BERICHT] = await Promise.all([hole("api/config"), hole("api/status")]);
    const gewuenscht = BERICHT?.sprache || "de";
    if (gewuenscht !== SPRACHE && UI[gewuenscht]) { SPRACHE = gewuenscht; }
    texteSetzen();
    $("#fassung").textContent = "v" + (CONFIG.version || "");
    const gut = BERICHT.zeit && !BERICHT.fehler;
    $("#punkt").classList.toggle("ok", Boolean(gut));
    $("#kopfstatus").textContent = BERICHT.fehler || BERICHT.hinweis
      || t(BERICHT.rauch ? "kopf.rauch"
           : !BERICHT.automatik ? "kopf.automatik_aus"
           : BERICHT.trockenlauf ? "kopf.trockenlauf"
           : BERICHT.urlaub ? "kopf.urlaub" : "kopf.laeuft");
    zeichneUebersicht();
    zeichneRollos();
    zeichnePlaene();
    zeichneEinstellungen();
    zeichneRauchalarm();
    if (GRUPPEN === null) zeichneGruppen();
  } catch (err) {
    $("#kopfstatus").textContent = err.message;
    $("#punkt").classList.remove("ok");
  }
}

$$("nav button").forEach((knopf) => knopf.onclick = () => {
  $$("nav button").forEach((b) => b.classList.toggle("an", b === knopf));
  $$("main section").forEach((s) =>
    s.classList.toggle("an", s.id === "s-" + knopf.dataset.reiter));
  if (knopf.dataset.reiter === "protokoll") ladeProtokoll();
  if (knopf.dataset.reiter === "schalter") ladeSchalter();
  if (knopf.dataset.reiter === "einrichtung") { ladeVorschlag(); ladeGesundheit(); }
});

$("#btn-takt").onclick = async () => {
  $("#btn-takt").disabled = true;
  try { BERICHT = await holeJSON("api/takt", "POST"); zeichneUebersicht(); melden(t("kopf.gerechnet")); }
  catch (err) { melden(err.message, true); }
  finally { $("#btn-takt").disabled = false; }
};
$("#btn-durchsetzen").onclick = async () => {
  if (!confirm(t("kopf.durchsetzen_frage"))) return;
  try { await holeJSON("api/durchsetzen", "POST"); melden(t("kopf.durchgesetzt"));
        setTimeout(aktualisieren, 1500); }
  catch (err) { melden(err.message, true); }
};
$("#btn-rollo-neu").onclick = () => rolloDialog(null);
$("#btn-plan-neu").onclick = () => planDialog(null);
$("#btn-dlg-speichern").onclick = dialogSpeichern;
$("#btn-dlg-loeschen").onclick = dialogLoeschen;
$("#btn-schalter-neu").onclick = () => {
  (SCHALTER = SCHALTER || []).push({name: t("neu.schalter"), art: "schalter",
                                    optionen: [], vorgabe: "on", icon: ""});
  zeichneSchalter();
};
$("#btn-auswahl-neu").onclick = () => {
  (SCHALTER = SCHALTER || []).push({name: t("neu.auswahl"), art: "auswahl",
                                    optionen: [t("neu.auswahl_normal"), t("neu.auswahl_aus")],
                                    vorgabe: t("neu.auswahl_normal"),
                                    icon: ""});
  zeichneSchalter();
};
$("#btn-schalter-speichern").onclick = async () => {
  try {
    SCHALTER = await holeJSON("api/schalter", "PUT", {schalter: SCHALTER});
    melden(t("allg.gespeichert"));
    await aktualisieren();
    await ladeSchalter();
  } catch (err) { melden(err.message, true); }
};
$("#btn-einst-speichern").onclick = einstellungenSpeichern;
$("#btn-rauch-speichern").onclick = rauchalarmSpeichern;
$("#btn-gruppen-speichern").onclick = gruppenSpeichern;
$("#btn-gruppe-neu").onclick = () => {
  GRUPPEN.push({name: t("neu.gruppe"), rollos: [], plan: "", schalter: "", aktiv: true});
  zeichneGruppen();
};
$("#btn-gruppe-vorschlag").onclick = async () => {
  try {
    const v = await hole("api/gruppen/vorschlag");
    if (!confirm(t("gr.vorschlag_frage", {n: v.length}))) return;
    GRUPPEN = v;
    zeichneGruppen();
  } catch (err) { melden(err.message, true); }
};
$("#btn-rauch-probe").onclick = async () => {
  try {
    const a = await holeJSON("api/rauchalarm/probe", "POST", {});
    melden(a.gesendet.length
      ? t("pb.gesendet_an", {liste: a.gesendet.join(", ")})
      : t("pb.nichts"), !a.gesendet.length);
  } catch (err) { melden(err.message, true); }
};
$("#btn-probe").onclick = async () => {
  try { const r = await holeJSON("api/wachhund/probe", "POST");
        melden(t("pb.wachhund", {liste: r.gesendet.join(", ") || "–"})); }
  catch (err) { melden(err.message, true); }
};
$("#btn-protokoll-leeren").onclick = async () => {
  if (!confirm(t("pr.leeren_frage"))) return;
  await holeJSON("api/logbuch", "DELETE"); ladeProtokoll();
};
$("#btn-gesundheit").onclick = ladeGesundheit;

(async function start(){
  try { ENTITAETEN = await hole("api/entitaeten"); } catch { ENTITAETEN = {}; }
  await aktualisieren();
  setInterval(async () => {
    try { BERICHT = await hole("api/status"); zeichneUebersicht(); } catch {}
  }, 20000);
})();

</script>
</body>
</html>
