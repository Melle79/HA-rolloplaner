<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rolloplaner</title>
<style>
  /* Rolloplaner 3 – vier Bereiche statt neun Reiter.
     Heute: was die Rollos tun und warum. Tagesablauf: der Tag als Balken,
     zum Ändern antippen. Programme: Weihnachtszeit, Urlaub, Hitzeschutz,
     Rauchalarm. Einstellungen: der Rest; Bedingungen, Schalter und Gruppen
     stehen in der erweiterten Ansicht (erweitert.html). */
  :root{
    --bg:#10141a; --flaeche:#181d25; --flaeche2:#1e2530; --flaeche3:#242c38;
    --linie:#2b323d; --text:#e9edf2; --leise:#9aa4b2; --grau:#6c7684;
    --marke:#5aa9e6; --marke-tief:#1d3247; --sonne:#f3b65b; --sonne-tief:#3a2a12;
    --ok:#4cc38a; --ok-tief:#183a2a; --achtung:#e36d6d; --achtung-tief:#3d1f22;
    --offen:#9cc9f2; --teil:#5b87b8; --zu:#3b4552;
    --rund:10px; --rund-gross:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{background:var(--bg); color:var(--text); min-height:100vh;
    font-family:"Avenir Next","Segoe UI",system-ui,sans-serif; font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased}
  button,input,select{font:inherit; color:inherit}
  a{color:var(--marke)}

  /* ── Kopf ── */
  header{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 20px;
    background:var(--flaeche); border-bottom:1px solid var(--linie)}
  header h1{font-size:1.05rem; font-weight:600}
  header .fassung{font-size:.72rem; color:var(--grau)}
  header .lauf{display:flex; align-items:center; gap:6px; font-size:.85rem; color:var(--leise)}
  .punkt{width:8px; height:8px; border-radius:50%; background:var(--achtung); flex:none}
  .punkt.ok{background:var(--ok)}
  header .rechts{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .chip{font-size:.72rem; font-weight:700; letter-spacing:.05em; padding:3px 10px; border-radius:999px;
    background:var(--flaeche3); color:var(--leise); white-space:nowrap}
  .chip.sonne{background:var(--sonne-tief); color:var(--sonne)}
  .chip.marke{background:var(--marke-tief); color:var(--offen)}
  .chip.ok{background:var(--ok-tief); color:var(--ok)}
  .chip.achtung{background:var(--achtung-tief); color:var(--achtung)}

  nav{display:flex; background:var(--flaeche); border-bottom:1px solid var(--linie); padding:0 12px;
    overflow-x:auto}
  nav button{min-height:48px; padding:0 16px; border:0; background:none; color:var(--leise);
    font-size:.95rem; cursor:pointer; white-space:nowrap; border-bottom:3px solid transparent}
  nav button.an{color:var(--text); font-weight:600; border-bottom-color:var(--marke)}
  nav button:focus-visible{outline:2px solid var(--marke); outline-offset:-2px}

  main{max-width:1120px; margin:0 auto; padding:20px 20px 48px}
  section{display:none}
  section.an{display:block}

  /* ── Bausteine ── */
  .tafel{background:var(--flaeche); border:1px solid var(--linie); border-radius:var(--rund-gross);
    padding:16px 20px}
  .tafel + .tafel, .tafel + h2, .gitter + h2{margin-top:16px}
  h2{font-size:.72rem; text-transform:uppercase; letter-spacing:.13em; color:var(--leise);
    font-weight:600; margin-bottom:10px}
  h3{font-size:1rem; font-weight:600}
  .leise{color:var(--leise)}
  .klein{font-size:.85rem}
  .knopf{min-height:40px; padding:0 14px; border-radius:var(--rund); border:1px solid var(--linie);
    background:var(--flaeche2); cursor:pointer; white-space:nowrap}
  .knopf:hover{background:var(--flaeche3)}
  .knopf:disabled{opacity:.4; cursor:default}
  .knopf.haupt{background:var(--marke); border-color:var(--marke); color:#0d1621; font-weight:600}
  .knopf.sonne{border-color:var(--sonne); background:var(--sonne-tief); color:var(--sonne); font-weight:600}
  .knopf.klein{min-height:34px; padding:0 10px; font-size:.85rem}
  .knopf:focus-visible, select:focus-visible, input:focus-visible{outline:2px solid var(--marke); outline-offset:1px}
  input[type=text], input[type=time], input[type=number], input[type=date], input[type=search], select{
    min-height:40px; padding:0 10px; border-radius:var(--rund); border:1px solid var(--linie);
    background:var(--flaeche2); max-width:100%}
  input[type=number]{width:90px}
  label.feld{display:flex; flex-direction:column; gap:4px; font-size:.85rem; color:var(--leise)}
  label.haken{display:flex; align-items:center; gap:10px; min-height:40px; cursor:pointer}
  label.haken input{width:18px; height:18px; accent-color:var(--marke)}
  .zeile{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end}
  .zeile + .zeile{margin-top:12px}
  .wahl{display:inline-flex; border:1px solid var(--linie); border-radius:999px; overflow:hidden}
  .wahl button{min-height:38px; padding:0 14px; border:0; background:none; color:var(--leise); cursor:pointer}
  .wahl button.an{background:var(--marke-tief); color:var(--text)}
  .gitter{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:14px}
  .trenn{border-top:1px solid var(--linie); margin:14px 0}
  .leer{color:var(--grau); padding:16px 0; text-align:center}
  #melder{position:fixed; left:50%; bottom:20px; transform:translate(-50%,40px); opacity:0;
    background:var(--flaeche3); border:1px solid var(--linie); padding:10px 18px; border-radius:999px;
    transition:.2s; z-index:20; max-width:92vw}
  #melder.an{opacity:1; transform:translate(-50%,0)}
  #melder.schlecht{border-color:var(--achtung); color:var(--achtung)}

  /* ── Heute ── */
  .lage{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px}
  .lage div b{display:block; font-size:.7rem; letter-spacing:.12em; color:var(--leise); font-weight:600}
  .lage div span{font-size:.95rem}
  .raum h3{font-size:.75rem; letter-spacing:.12em; text-transform:uppercase; color:var(--leise);
    margin-bottom:10px}
  .rollo{display:grid; grid-template-columns:44px 1fr auto; gap:6px 14px; align-items:start;
    padding:12px 0; border-top:1px solid var(--linie)}
  .rollo:first-of-type{border-top:0; padding-top:0}
  .rollo .name{font-weight:600}
  .rollo .info{font-size:.85rem; color:var(--leise)}
  .rollo .prozent{text-align:right; font-size:1.5rem; font-weight:300; line-height:1.1}
  .rollo .prozent small{display:block; font-size:.72rem; color:var(--leise)}
  .rollo .knoepfe{grid-column:2 / 4; display:flex; gap:6px; flex-wrap:wrap}
  .fenster{width:40px; height:48px; border:2px solid #56606d; border-radius:3px; position:relative;
    overflow:hidden; background:linear-gradient(#24476a,#3c6d99)}
  .fenster i{position:absolute; left:0; right:0; top:0;
    background:repeating-linear-gradient(#4a535e 0 3px,#39414b 3px 6px)}
  .fenster.tuer{height:56px}

  /* ── Tagesablauf ── */
  .steuer{display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:14px}
  .ablauf{display:grid; grid-template-columns:minmax(110px,170px) 1fr; gap:6px 12px; align-items:center}
  .ablauf .lbl{border:0; background:none; text-align:left; cursor:pointer; color:var(--leise);
    min-height:34px; font-size:.88rem; padding:0}
  .ablauf .lbl.an{color:var(--text); font-weight:600}
  .balken{position:relative; height:28px; border-radius:6px; overflow:hidden; background:var(--zu);
    cursor:pointer}
  .balken.licht{height:12px; background:var(--flaeche2); cursor:default}
  .balken.licht i{background:var(--sonne)}
  .balken i{position:absolute; top:0; bottom:0; font-style:normal; font-size:.7rem;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    border-right:1px solid var(--bg); white-space:nowrap}
  .balken .jetzt{background:#ff8a5c; width:2px; border:0; z-index:2}
  .balken.hand{background:repeating-linear-gradient(135deg,#23282f 0 8px,#2a3038 8px 16px);
    display:flex; align-items:center; justify-content:center; font-size:.72rem; color:var(--leise)}
  .achse{display:flex; justify-content:space-between; font-size:.7rem; color:var(--grau)}
  .legende{display:flex; gap:14px; flex-wrap:wrap; font-size:.8rem; color:var(--leise); margin-top:10px}
  .legende i{display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-1px; margin-right:5px}
  .punktkarte{border:1px solid var(--linie); border-radius:var(--rund); padding:12px; background:var(--flaeche2)}
  .punktkarte + .punktkarte{margin-top:10px}
  .punktkarte .zeile{align-items:center}
  details.mehr summary{cursor:pointer; color:var(--leise); font-size:.85rem; margin-top:8px}
  .tage{display:flex; gap:4px}
  .tage label{cursor:pointer}
  .tage input{position:absolute; opacity:0; width:1px; height:1px}
  .tage span{display:inline-block; min-width:34px; padding:6px 0; text-align:center; border-radius:6px;
    background:var(--flaeche3); color:var(--leise); font-size:.8rem}
  .tage input:checked + span{background:var(--marke-tief); color:var(--text)}
  .tage input:focus-visible + span{outline:2px solid var(--marke)}

  /* ── Programme ── */
  .programm{display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap}
  .programm .text{flex:1; min-width:220px}
  .liste > div{display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--linie)}
  .liste > div:first-child{border-top:0}
  .liste > div span.n{flex:1}
  .treffer{max-height:260px; overflow:auto; border:1px solid var(--linie); border-radius:var(--rund); margin-top:8px}
  .treffer button{display:flex; width:100%; gap:10px; text-align:left; border:0; background:none;
    padding:10px 12px; cursor:pointer; border-top:1px solid var(--linie)}
  .treffer button:first-child{border-top:0}
  .treffer button:hover{background:var(--flaeche2)}

  /* ── Einstellungen ── */
  .eintrag{display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--linie)}
  .eintrag:first-of-type{border-top:0}
  .eintrag .text{flex:1; min-width:0}
  .protokoll{font-size:.85rem}
  .protokoll div{display:grid; grid-template-columns:110px 1fr; gap:10px; padding:6px 0;
    border-top:1px solid var(--linie)}

  dialog{margin:auto; background:var(--flaeche); color:var(--text); border:1px solid var(--linie);
    border-radius:var(--rund-gross); padding:0; width:min(620px,94vw); max-height:92vh}
  dialog::backdrop{background:rgba(6,9,13,.72)}
  dialog .kopf{display:flex; align-items:center; padding:14px 18px; border-bottom:1px solid var(--linie)}
  dialog .kopf h3{flex:1}
  dialog .inhalt{padding:16px 18px; overflow:auto}
  dialog .fuss{display:flex; justify-content:flex-end; gap:8px; padding:12px 18px; border-top:1px solid var(--linie)}

  @media (max-width:640px){
    header{padding:10px 16px}
    main{padding:16px 16px 40px}
    nav{padding:0 4px}
    nav button{padding:0 8px; flex:1; font-size:.86rem}
    .gitter{grid-template-columns:1fr}
    .ablauf{grid-template-columns:96px 1fr}
    .tafel{padding:14px 16px}
  }
</style>
</head>
<body>
<header>
  <h1>Rolloplaner</h1><span class="fassung" id="fassung"></span>
  <span class="lauf"><span class="punkt" id="punkt"></span><span id="lauf">…</span></span>
  <div class="rechts">
    <span id="kopfchips"></span>
    <button class="knopf klein" id="alle-auf" data-t="kopf.alle_auf">Alle auf</button>
    <button class="knopf klein" id="alle-zu" data-t="kopf.alle_zu">Alle zu</button>
  </div>
</header>
<nav>
  <button data-reiter="heute" class="an" data-t="nav.heute">Heute</button>
  <button data-reiter="ablauf" data-t="nav.ablauf">Tagesablauf</button>
  <button data-reiter="programme" data-t="nav.programme">Programme</button>
  <button data-reiter="einstellungen" data-t="nav.einstellungen">Einstellungen</button>
</nav>
<main>
  <section id="s-heute" class="an">
    <div class="tafel"><div class="lage" id="lage"></div></div>
    <div id="hinweise"></div>
    <div class="gitter" id="raeume" style="margin-top:16px"></div>
  </section>

  <section id="s-ablauf">
    <div class="tafel">
      <h2 data-t="ab.titel">So fahren die Rollos</h2>
      <p class="leise klein" data-t="ab.hilfe" style="margin-bottom:12px">Ein Balken je Rollo, von 0 bis 24 Uhr. Antippen zum Ändern.</p>
      <div class="steuer" id="ab-steuer"></div>
      <div class="ablauf" id="ab-balken"></div>
      <div class="legende" id="ab-legende"></div>
    </div>
    <div class="tafel" id="editor" hidden></div>
  </section>

  <section id="s-programme"><div id="programme"></div></section>
  <section id="s-einstellungen"><div id="einstellungen"></div></section>
</main>

<dialog id="dialog"><form method="dialog" id="dlg-form">
  <div class="kopf"><h3 id="dlg-titel"></h3>
    <button class="knopf klein" value="ab" data-t="knopf.schliessen">Schließen</button></div>
  <div class="inhalt" id="dlg-inhalt"></div>
  <div class="fuss"><button class="knopf" value="ab" data-t="knopf.abbrechen">Abbrechen</button>
    <button class="knopf haupt" value="ok" id="dlg-ok" data-t="knopf.speichern">Speichern</button></div>
</form></dialog>
<div id="melder" role="status" aria-live="polite"></div>

   Deutsch ist die Rückfallebene; die Sprache sagt der Planer im Bericht. */

let SPRACHE = "de";
function t(k, w){
  const v = UI[SPRACHE]?.[k] ?? UI.de[k] ?? k;
  return w ? v.replace(/\{(\w+)\}/g, (g, n) => w[n] !== undefined ? w[n] : g) : v;
}
function texteSetzen(){
  document.documentElement.lang = SPRACHE;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
}

/* ═══ Werkzeug ═══ */
const $ = (s, w=document) => w.querySelector(s);
const $$ = (s, w=document) => [...w.querySelectorAll(s)];
const esc = (x) => String(x ?? "").replace(/[&<>"']/g,
  (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function melden(text, schlecht=false){
  const m = $("#melder"); m.textContent = text; m.classList.toggle("schlecht", schlecht);
  m.classList.add("an"); clearTimeout(melden._t); melden._t = setTimeout(() => m.classList.remove("an"), 3500);
}
async function hole(pfad, opt){
  const a = await fetch(pfad, opt); const text = await a.text(); let d = null;
  try { d = text ? JSON.parse(text) : null; } catch { d = null; }
  if (!a.ok) throw new Error((d && d.fehler) || a.statusText);
  return d;
}
const sende = (pfad, methode, koerper) => hole(pfad, {method: methode,
  headers: {"Content-Type":"application/json"}, body: koerper === undefined ? undefined : JSON.stringify(koerper)});
async function versuch(fn, ok){
  try { const r = await fn(); if (ok) melden(ok); return r; }
  catch (e) { melden(t("allg.fehler", {t: e.message}), true); throw e; }
}
const uhr = (iso) => { if (!iso) return "–"; const d = new Date(iso);
  return isNaN(d) ? "–" : d.toLocaleTimeString(SPRACHE === "en" ? "en-GB" : "de-DE", {hour:"2-digit", minute:"2-digit"}); };
const datum = (iso) => { if (!iso) return "–"; const d = new Date(iso + (iso.length === 10 ? "T12:00" : ""));
  return d.toLocaleDateString(SPRACHE === "en" ? "en-GB" : "de-DE", {day:"numeric", month:"numeric", year: undefined}); };
const kopie = (o) => JSON.parse(JSON.stringify(o));
/* Diese Seite zeigt immer „% offen“ – die Zählweise von Home Assistant. */
const stellungText = (p) => p === null || p === undefined ? "–"
  : p >= 100 ? t("allg.offen") : p <= 0 ? t("allg.zu") : t("allg.prozent_offen", {n: p});
const kurzname = (name, raum) => {
  let n = String(name || "").replace(/^Rollo\s+/i, "");
  if (raum && n.toLowerCase().includes(raum.toLowerCase()) && n.length > raum.length)
    n = n.replace(new RegExp(raum.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i"), "").trim();
  return n || name;
};

/* „links“ allein sagt nichts – dann gehört das Zimmer davor. */
const ALLGEMEIN = /^(links|rechts|mitte|fenster|balkont(ü|ue)r|terrassent(ü|ue)r|t(ü|ue)r|left|right|window|door)$/i;
const zeilenname = (r) => { const k = kurzname(r.name, r.raum);
  return r.raum && ALLGEMEIN.test(k) ? r.raum + " " + k : k; };
let CONFIG = null, BERICHT = null, ABLAUF = null, LICHTER = null, ENT = null;
let REITER = "heute", AB_ART = null, AB_XMAS = null, AUSWAHL = null, ENTWURF = null, XENTWURF = null;

/* ═══ Laden ═══ */
async function laden(){
  try {
    [CONFIG, BERICHT] = await Promise.all([hole("api/config"), hole("api/status")]);
  } catch (e) {
    $("#lauf").textContent = t("kopf.keine_verbindung"); $("#punkt").classList.remove("ok"); return;
  }
  if (BERICHT?.sprache && UI[BERICHT.sprache]) SPRACHE = BERICHT.sprache;
  texteSetzen();
  zeichneKopf();
  if (REITER === "heute") zeichneHeute();
  if (REITER === "programme" && !XENTWURF) zeichneProgramme();
}
async function nachrechnen(){
  try { await sende("api/takt", "POST"); } catch {}
  await laden();
  if (REITER === "ablauf") await ladeAblauf();
}

function rollosSortiert(){
  const r = [...(BERICHT?.rollos || [])];
  const gruppen = (CONFIG?.gruppen || []).map((g) => g.id);
  r.sort((a, b) => (gruppen.indexOf(a.gruppe_id) - gruppen.indexOf(b.gruppe_id))
    || (a.gruppe_platz - b.gruppe_platz) || a.name.localeCompare(b.name));
  return r;
}
function raeume(liste){
  const out = [];
  for (const r of liste){
    const n = r.raum || "–";
    let raum = out.find((x) => x.name === n);
    if (!raum){ raum = {name: n, rollos: []}; out.push(raum); }
    raum.rollos.push(r);
  }
  return out;
}
const rolloCfg = (eid) => (CONFIG?.rollos || []).find((r) => r.entity_id === eid);

/* ═══ Kopf ═══ */
function zeichneKopf(){
  $("#fassung").textContent = CONFIG?.version ? "v" + CONFIG.version : "";
  const rollos = BERICHT?.rollos || [];
  const auto = rollos.filter((r) => !["aus","von_hand","fehlt"].includes(r.zustand)).length;
  let lauf = t("kopf.laeuft", {n: auto, m: rollos.length});
  if (BERICHT && !BERICHT.automatik) lauf = t("kopf.automatik_aus");
  if (BERICHT?.trockenlauf) lauf = t("kopf.trockenlauf");
  $("#lauf").textContent = lauf;
  $("#punkt").classList.toggle("ok", Boolean(BERICHT?.automatik) && !BERICHT?.trockenlauf);
  const chips = [];
  if (BERICHT?.weihnachtszeit?.aktiv) chips.push(`<span class="chip sonne">${esc(t("pg.weihnacht"))}</span>`);
  if (BERICHT?.urlaub) chips.push(`<span class="chip marke">${esc(t("pg.urlaub"))}</span>`);
  if (BERICHT?.rauch) chips.push(`<span class="chip achtung">${esc(t("pg.rauch"))}</span>`);
  $("#kopfchips").innerHTML = chips.join(" ");
}
async function alleFahren(position){
  const rollos = (BERICHT?.rollos || []).filter((r) => r.zustand !== "fehlt");
  if (!confirm(t("kopf.alle_frage", {n: rollos.length, was: position ? t("rl.auf") + " " : t("rl.zu") + " "}).replace("  ", " "))) return;
  for (const r of rollos){
    try { await sende("api/fahren", "POST", {rollo: r.entity_id, position}); } catch (e) { melden(t("allg.fehler", {t: e.message}), true); }
  }
  setTimeout(laden, 1500);
}

/* ═══ Heute ═══ */
function fensterBild(r){
  const tuer = ["balkontuer","terrassentuer","haustuer"].includes(r.art);
  const zu = r.ist === null || r.ist === undefined ? 0 : 100 - r.ist;
  return `<div class="fenster${tuer ? " tuer" : ""}" aria-hidden="true"><i style="height:${zu}%"></i></div>`;
}
function zustandsSchild(r){
  let z = r.zustand;
  if (z === "plan" && r.grund_punkt?.programm) z = "weihnachtszeit";
  const farbe = {plan:"marke", weihnachtszeit:"sonne", manuell:"sonne", beschattung:"sonne",
    fenster:"achtung", rauch:"achtung", fluchtweg:"achtung", fehlt:"achtung", urlaub:"marke"}[z] || "";
  return `<span class="chip ${farbe}">${esc(t("zs." + z).toUpperCase())}</span>`;
}
function begruendung(r){
  return (r.begruendungen && (r.begruendungen[SPRACHE] || r.begruendungen.de)) || r.begruendung || "";
}
function naechstes(r){
  const n = r.naechste_punkte && (r.naechste_punkte[SPRACHE] || r.naechste_punkte.de) || r.naechster_punkt;
  return n ? t("rl.dann", {was: n}) : "";
}
function zeichneHeute(){
  if (!BERICHT) return;
  const b = BERICHT;
  const tagArt = (frei) => frei === null || frei === undefined ? t("lage.unbekannt")
    : frei ? t("lage.schulfrei") : t("lage.schultag");
  const rollos = rollosSortiert();
  const kommende = rollos.filter((r) => r.naechster_zeitpunkt)
    .sort((a, c) => a.naechster_zeitpunkt.localeCompare(c.naechster_zeitpunkt));
  const erster = kommende[0];
  const x = b.weihnachtszeit || {};
  const prog = x.aktiv ? t("pg.weihnacht") : (x.eingerichtet && x.von ? t("pg.weihnacht") + " " + t("pg.ab", {datum: datum(x.von)}).toLowerCase() : t("lage.kein_programm"));
  const fehlend = rollos.filter((r) => r.zustand === "fehlt");
  const stoer = (b.stoerungen || []).length + fehlend.length;
  $("#lage").innerHTML = `
    <div><b>${esc(t("lage.heute").toUpperCase())}</b><span>${esc(tagArt(b.schulfrei))} · ${esc(t("lage.morgen", {art: tagArt(b.schulfrei_morgen)}))}</span></div>
    <div><b>${esc(t("lage.sonne").toUpperCase())}</b><span>${esc(uhr(b.sonne?.aufgang))} – ${esc(uhr(b.sonne?.untergang))}${b.aussen !== null && b.aussen !== undefined ? " · " + esc(t("lage.aussen", {t: String(b.aussen).replace(".", SPRACHE === "de" ? "," : ".")})) : ""}</span></div>
    <div><b>${esc(t("lage.naechstes").toUpperCase())}</b><span>${erster ? esc(erster.naechste_uhrzeit + " · " + kurzname(erster.name, "") + " " + stellungText(erster.naechste_stellung)) : esc(t("lage.nichts"))}</span></div>
    <div><b>${esc(t("lage.programme").toUpperCase())}</b><span>${esc(prog)}</span></div>
    <div><b>${esc(t("lage.stoerungen").toUpperCase())}</b><span>${stoer ? `<span style="color:var(--achtung)">${stoer}</span>` : esc(t("allg.keine") + " · " + t("lage.alle_erreichbar", {n: rollos.length}))}</span></div>`;
  const hinweise = [];
  if (b.trockenlauf) hinweise.push(`<div class="tafel" style="margin-top:16px; border-color:var(--sonne)">${esc(t("lage.trockenlauf"))}</div>`);
  if (b.rauch) hinweise.push(`<div class="tafel" style="margin-top:16px; border-color:var(--achtung)">${esc(t("lage.rauch", {grund: b.rauch_grund || ""}))}</div>`);
  $("#hinweise").innerHTML = hinweise.join("");

  $("#raeume").innerHTML = raeume(rollos).map((raum) => `
    <div class="tafel raum"><h3>${esc(raum.name)}</h3>
      ${raum.rollos.map((r) => {
        const cfg = rolloCfg(r.entity_id) || {};

        const info = [begruendung(r), naechstes(r)].filter(Boolean).join(" · ");
        const ist = r.ist;
        return `<div class="rollo" data-eid="${esc(r.entity_id)}">
          ${fensterBild(r)}
          <div><div class="name">${esc(kurzname(r.name, raum.name))}</div>
            <div style="margin:4px 0">${zustandsSchild(r)}</div>
            <div class="info">${esc(info)}</div></div>
          <div class="prozent">${ist === null || ist === undefined ? "–" : ist}<span style="font-size:.9rem">%</span><small>${esc(t("allg.offen"))}</small></div>
          <div class="knoepfe">
            <button class="knopf klein" data-fahre="100" ${ist >= 100 ? "disabled" : ""}>${esc(t("rl.auf"))}</button>
            ${r.kann_stop ? `<button class="knopf klein" data-halt>${esc(t("rl.halt"))}</button>` : ""}
            <button class="knopf klein" data-fahre="0" ${ist !== null && ist <= 0 ? "disabled" : ""}>${esc(t("rl.zu"))}</button>
            ${handOnly ? "" : `<button class="knopf klein" data-auto>${esc(cfg.aktiv === false ? t("rl.automatik_aus") : t("rl.automatik_an"))}</button>`}
            ${r.zustand === "manuell" ? `<button class="knopf klein" data-hand>${esc(t("rl.hand_aufheben"))}</button>` : ""}
          </div></div>`;
      }).join("")}

$("#raeume").addEventListener("click", async (ev) => {
  const k = ev.target.closest("button"); if (!k) return;
  const eid = k.closest("[data-eid]")?.dataset.eid; if (!eid) return;
  k.disabled = true;
  try {
    if (k.dataset.fahre !== undefined) await versuch(() => sende("api/fahren", "POST", {rollo: eid, position: Number(k.dataset.fahre)}));
    else if (k.dataset.halt !== undefined) await versuch(() => sende("api/stop", "POST", {rollo: eid}));
    else if (k.dataset.hand !== undefined) await versuch(() => hole(`api/handbetrieb?rollo=${encodeURIComponent(eid)}`, {method:"DELETE"}));
    else if (k.dataset.auto !== undefined){
      const cfg = kopie(rolloCfg(eid)); cfg.aktiv = cfg.aktiv === false;
      await versuch(() => sende(`api/rollos/${encodeURIComponent(eid)}`, "PUT", cfg));
    }
  } catch {}
  setTimeout(laden, 1200);
});

  if (AB_ART === null) AB_ART = BERICHT?.schulfrei ? "schulfrei" : "schultag";
  if (AB_XMAS === null) AB_XMAS = BERICHT?.weihnachtszeit?.aktiv ? "an" : "aus";
  try { ABLAUF = await hole(`api/tagesablauf?art=${AB_ART}&weihnachtszeit=${AB_XMAS}`); }
  catch (e) { melden(t("allg.fehler", {t: e.message}), true); return; }
  zeichneAblauf();
}
const minuten = (hhmm) => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };
const farbe = (p) => p === null || p === undefined ? "var(--flaeche2)" : p >= 100 ? "var(--offen)" : p <= 0 ? "var(--zu)" : "var(--teil)";
function segmente(r){
  const out = []; let pos = r.start, von = 0;
  for (const p of r.punkte){
    const m = minuten(p.zeit);
    if (m > von) out.push([von, m, pos]);
    pos = p.position; von = m;
  }
  if (von < 1440) out.push([von, 1440, pos]);
  return out;
}
function balkenHTML(segs){
  return segs.map(([a, b, p]) => {
    const breit = (b - a) / 1440 > .07;
    const txt = !breit ? "" : p >= 100 ? t("ab.l_offen") : p <= 0 ? t("ab.l_zu") : p === null ? "" : p + " %";
    return `<i style="left:${a / 14.4}%; width:${(b - a) / 14.4}%; background:${farbe(p)}; color:${p >= 100 ? "#14202c" : "var(--text)"}">${esc(txt)}</i>`;
  }).join("");
}
function zeichneAblauf(){
  const x = BERICHT?.weihnachtszeit || {};
  const zeigeX = x.eingerichtet || x.aktiv || (CONFIG?.einstellungen?.weihnachtszeit?.lichter || []).length;
  $("#ab-steuer").innerHTML = `
    <div class="wahl" role="group">${["schultag","schulfrei"].map((a) =>
      `<button data-art="${a}" class="${AB_ART === a ? "an" : ""}" aria-pressed="${AB_ART === a}">${esc(t("ab." + a))}</button>`).join("")}</div>
    ${zeigeX ? `<div class="wahl" role="group"><button data-x="an" class="${AB_XMAS === "an" ? "an" : ""}">${esc(t("ab.mit_weihnacht"))}</button><button data-x="aus" class="${AB_XMAS === "aus" ? "an" : ""}">${esc(t("ab.ohne_weihnacht"))}</button></div>` : ""}`;
  const heute = ABLAUF && ABLAUF.datum === new Date().toISOString().slice(0, 10);
  const jetzt = new Date(); const jm = jetzt.getHours() * 60 + jetzt.getMinutes();
  const sortierung = rollosSortiert().map((r) => r.entity_id);
  const rollos = [...(ABLAUF?.rollos || [])].sort((a, b) => sortierung.indexOf(a.entity_id) - sortierung.indexOf(b.entity_id));
  let html = "";
  for (const r of rollos){
    const name = zeilenname(r);
    html += `<button class="lbl ${AUSWAHL === r.entity_id ? "an" : ""}" data-sel="${esc(r.entity_id)}">${esc(name)}</button>`;
    if (r.von_hand) html += `<div class="balken hand" data-sel="${esc(r.entity_id)}">${esc(t("ab.nur_hand"))}</div>`;
    else html += `<div class="balken" data-sel="${esc(r.entity_id)}" role="img" aria-label="${esc(name)}">${balkenHTML(segmente(r))}${heute ? `<i class="jetzt" style="left:${jm / 14.4}%"></i>` : ""}</div>`;
  }
  if ((ABLAUF?.licht || []).length){
    html += `<span class="lbl" style="cursor:default">${esc(t("ab.licht"))}</span><div class="balken licht">${ABLAUF.licht.map((l) =>
      `<i style="left:${minuten(l.von) / 14.4}%; width:${(minuten(l.bis) - minuten(l.von)) / 14.4}%"></i>`).join("")}</div>`;
  }
  html += `<span></span><div class="achse"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div>`;
  $("#ab-balken").innerHTML = html;
  $("#ab-legende").innerHTML = [["var(--offen)","ab.l_offen"],["var(--teil)","ab.l_teil"],["var(--zu)","ab.l_zu"]]
    .concat((ABLAUF?.licht || []).length ? [["var(--sonne)","ab.l_licht"]] : [])
    .map(([f, k]) => `<span><i style="background:${f}"></i>${esc(t(k))}</span>`).join("");
}

function planVon(eid){
  const r = rolloCfg(eid); if (!r) return null;

}

}

$("#editor").addEventListener("change", async (ev) => {
  const el = ev.target;
  if (el.id === "ed-plan"){
    const r = kopie(rolloCfg(AUSWAHL)); r.plan = el.value;
    if (!el.value && !(r.zeitplan || []).length){
      const q = planVon(AUSWAHL); if (q?.art === "plan") r.zeitplan = kopie(q.plan.zeitplan);
    }
    try { await versuch(() => sende(`api/rollos/${encodeURIComponent(AUSWAHL)}`, "PUT", r), t("allg.gespeichert")); } catch { return; }
    ENTWURF = null; await laden(); await ladeAblauf(); zeichneEditor(); return;
  }
  const karte = el.closest("[data-i]"); if (!karte) return;
  const p = ENTWURF[Number(karte.dataset.i)];
  if (el.dataset.tag){ const s = new Set(p.tage || []); el.checked ? s.add(el.dataset.tag) : s.delete(el.dataset.tag); p.tage = TAGE.filter((d) => s.has(d)); return; }
  const f = el.dataset.f; if (!f) return;
  p[f] = ["position","versatz_min"].includes(f) ? Number(el.value) : el.value;
  if (f === "ausloeser") zeichneEditor();
});
$("#editor").addEventListener("click", async (ev) => {
  const k = ev.target.closest("button"); if (!k) return;
  if (k.dataset.weg !== undefined){ ENTWURF.splice(Number(k.closest("[data-i]").dataset.i), 1); zeichneEditor(); }
  else if (k.dataset.neu){
    ENTWURF.push(k.dataset.neu === "auf"

      : {ausloeser:"sonnenuntergang", start:"", position:0, gilt:"immer", tage:[...TAGE], versatz_min:0, frueh:"", spaet:"22:00", wenn:[], name:""});
    zeichneEditor();
  }
  else if (k.dataset.verwerfen !== undefined){ ENTWURF = null; zeichneEditor(); }
  else if (k.dataset.speichern !== undefined){
    const q = planVon(AUSWAHL);
    try {
      if (q.art === "plan") await versuch(() => sende(`api/plaene/${encodeURIComponent(q.plan.id)}`, "PUT", {...q.plan, zeitplan: ENTWURF}), t("allg.gespeichert"));

    } catch { return; }

  }
});

      <label class="feld">${esc(t("pg.hitze_pos"))}<input type="number" data-e="beschattung.position" value="${h.position}"></label>
      <label class="feld">${esc(t("pg.hitze_sonne"))}<input type="number" data-e="beschattung.min_elevation" value="${h.min_elevation}"></label></div>
    <div class="zeile"><label class="haken"><input type="checkbox" data-e="beschattung.nur_wenn_niemand_da" ${h.nur_wenn_niemand_da ? "checked" : ""}>${esc(t("pg.hitze_niemand"))}</label></div>
    <p class="leise klein">${esc(t("pg.hitze_rollos"))}</p>
    <div class="zeile" style="justify-content:flex-end"><button class="knopf haupt" data-e-speichern>${esc(t("knopf.speichern"))}</button></div>`;
  const rs = e.rauchsperre || {};
  const rauch = `<div class="zeile"><label class="haken"><input type="checkbox" data-e="rauchsperre.fluchtweg" ${rs.fluchtweg ? "checked" : ""}>${esc(t("pg.fluchtweg"))}</label></div>
    <div class="zeile"><label class="feld">${esc(t("pg.nachlauf"))}<input type="number" data-e="rauchsperre.nachlauf_min" value="${Number(rs.nachlauf_min || 0)}"></label></div>
    <p class="leise klein">${esc(t("pg.melder", {n: (rs.melder || []).length || (ENT?.rauch || []).length || "–"}))} <a href="erweitert.html">→</a></p>
    <div class="zeile" style="justify-content:flex-end"><button class="knopf haupt" data-e-speichern>${esc(t("knopf.speichern"))}</button></div>`;
  const beschattet = (BERICHT.rollos || []).some((r) => r.beschattet);
  $("#programme").innerHTML = `<p class="leise" style="margin-bottom:14px">${esc(t("pg.hilfe"))}</p>`
    + programmKarte("weihnacht", t("pg.weihnacht"), t("pg.weihnacht_text"), xSchild, weihnacht)
    + programmKarte("urlaub", t("pg.urlaub"), t("pg.urlaub_text"),
        `<span class="chip ${BERICHT.urlaub ? "marke" : ""}">${esc((BERICHT.urlaub ? t("pg.aktiv") : t("pg.aus")).toUpperCase())}</span>`, urlaub)
    + programmKarte("hitze", t("pg.hitze"), t("pg.hitze_text"),
        `<span class="chip ${beschattet ? "sonne" : ""}">${esc((!h.aktiv ? t("pg.aus") : beschattet ? t("pg.aktiv") : t("pg.ruht")).toUpperCase())}</span>`, hitze)
    + programmKarte("rauch", t("pg.rauch"), t("pg.rauch_text"),
        `<span class="chip ${BERICHT.rauch ? "achtung" : "ok"}">${esc((BERICHT.rauch ? t("pg.aktiv") : t("pg.bereit")).toUpperCase())}</span>`, rauch);
}
function entitaetWahl(schluessel, wert, quelle){
  const liste = (ENT?.[quelle] || []);
  const drin = liste.some((x) => x.entity_id === wert);
  return `<select data-e="${schluessel}"><option value="">${esc(t("es.keiner"))}</option>
    ${!drin && wert ? `<option value="${esc(wert)}" selected>${esc(wert)}</option>` : ""}
    ${liste.map((x) => `<option value="${esc(x.entity_id)}" ${x.entity_id === wert ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select>`;
}
/* Ein Feld wie „urlaub.modus“ in ein verschachteltes Teilobjekt schreiben. */
function feldWert(el){
  if (el.type === "checkbox") return el.checked;
  if (el.type === "number") return el.value === "" ? null : Number(el.value);
  return el.value;
}
function sammle(wurzel){
  const out = {};
  $$("[data-e]", wurzel).forEach((el) => {
    const teile = el.dataset.e.split("."); let o = out;
    teile.slice(0, -1).forEach((k) => { o = o[k] = o[k] || {}; });
    o[teile.at(-1)] = feldWert(el);
  });
  return out;
}
$("#programme").addEventListener("click", async (ev) => {
  const k = ev.target.closest("button"); if (!k) return;
  if (k.dataset.auf){ offenProgramm.has(k.dataset.auf) ? offenProgramm.delete(k.dataset.auf) : offenProgramm.add(k.dataset.auf); zeichneProgramme(); return; }
  if (k.dataset.xZeitraum){ XENTWURF.zeitraum = k.dataset.xZeitraum; zeichneProgramme(); return; }
  if (k.dataset.lichtWeg){ XENTWURF.lichter = XENTWURF.lichter.filter((x) => x !== k.dataset.lichtWeg); zeichneProgramme(); return; }
  if (k.dataset.lichtNeu){ if (!XENTWURF.lichter.includes(k.dataset.lichtNeu)) XENTWURF.lichter.push(k.dataset.lichtNeu); zeichneProgramme(); return; }
  if (k.dataset.xVerwerfen !== undefined){ XENTWURF = null; zeichneProgramme(); return; }
  if (k.dataset.xJetzt){
    try { await versuch(() => sende("api/weihnachtszeit", "POST", {an: k.dataset.xJetzt === "an"})); } catch { return; }
    await nachrechnen(); zeichneProgramme(); return;
  }
  if (k.dataset.xSpeichern !== undefined){
    try { await versuch(() => sende("api/einstellungen", "PUT", {weihnachtszeit: XENTWURF}), t("allg.gespeichert")); } catch { return; }
    XENTWURF = null; await nachrechnen(); zeichneProgramme(); return;
  }
  if (k.dataset.eSpeichern !== undefined){
    try { await versuch(() => sende("api/einstellungen", "PUT", sammle(k.closest(".tafel"))), t("allg.gespeichert")); } catch { return; }
    await nachrechnen(); zeichneProgramme();
  }
});
$("#programme").addEventListener("change", (ev) => {
  const el = ev.target;
  if (el.dataset.x){
    const f = el.dataset.x;
    XENTWURF[f] = ["licht_an_versatz","morgens_vorlauf"].includes(f) ? Number(el.value) : feldWert(el);
    if (f === "licht_an") zeichneProgramme();
  }
  if (el.dataset.xrollo){
    XENTWURF.rollos = XENTWURF.rollos || {};
    const v = el.value;
    XENTWURF.rollos[el.dataset.xrollo] = v === "plan" || v === "offen" ? v : Number(v);
  }
});
$("#programme").addEventListener("input", async (ev) => {
  if (ev.target.id !== "licht-suche") return;
  const q = ev.target.value.trim().toLowerCase(); const box = $("#licht-treffer");
  if (q.length < 2){ box.hidden = true; return; }
  if (!LICHTER){ try { LICHTER = await hole("api/lichter"); } catch { LICHTER = []; } }
  const treffer = LICHTER.filter((l) => !XENTWURF.lichter.includes(l.entity_id)
    && (l.name.toLowerCase().includes(q) || l.entity_id.includes(q) || (l.bereich || "").toLowerCase().includes(q))).slice(0, 30);
  box.hidden = !treffer.length;
  box.innerHTML = treffer.map((l) => `<button data-licht-neu="${esc(l.entity_id)}"><span style="flex:1">${esc(l.name)}<br><span class="leise klein">${esc(l.entity_id)}${l.bereich ? " · " + esc(l.bereich) : ""}</span></span><span class="leise klein">${esc(l.zustand)}</span></button>`).join("");
});

/* ═══ Einstellungen ═══ */
async function zeichneEinstellungen(){
  if (!CONFIG) return;
  if (!ENT){ try { ENT = await hole("api/entitaeten"); } catch { ENT = {}; } }
  let log = [];
  try { log = await hole("api/logbuch"); } catch {}
  const e = CONFIG.einstellungen; const w = e.wachhund || {};
  const rollos = rollosSortiert();
  $("#einstellungen").innerHTML = `
    <div class="tafel"><h2>${esc(t("es.betrieb"))}</h2>
      <label class="haken"><input type="checkbox" data-e="automatik" ${e.automatik ? "checked" : ""}>${esc(t("es.automatik"))}</label>
      <label class="haken"><input type="checkbox" data-e="trockenlauf" ${e.trockenlauf ? "checked" : ""}>${esc(t("es.trockenlauf"))}</label>
      <div class="zeile"><label class="haken"><input type="checkbox" data-e="manuell_respektieren" ${e.manuell_respektieren ? "checked" : ""}>${esc(t("es.hand"))}</label>
        <label class="feld">${esc(t("es.hand_stunden"))}<input type="number" data-e="manuell_stunden" value="${e.manuell_stunden}"></label></div>
      <div class="zeile"><label class="feld">${esc(t("es.sprache"))}<select data-e="sprache"><option value="">${esc(t("es.wie_ha"))}</option>
        ${(BERICHT?.sprachen || ["de","en"]).map((s) => `<option value="${esc(s)}" ${e.sprache === s ? "selected" : ""}>${esc(s)}</option>`).join("")}</select></label></div>
      <div class="zeile" style="justify-content:flex-end"><button class="knopf haupt" data-e-speichern>${esc(t("knopf.speichern"))}</button></div></div>

    <div class="tafel"><h2>${esc(t("es.rollos"))}</h2>
      ${rollos.map((r) => { const c = rolloCfg(r.entity_id) || {};
        const plan = c.plan ? (CONFIG.plaene.find((p) => p.id === c.plan) || {}).name : t("ed.eigener");
        return `<div class="eintrag"><div class="text"><b>${esc(r.name)}</b><div class="leise klein">${esc([r.raum, t("art." + (c.art || "fenster")), c.betriebsart === "von_hand" ? t("rd.b.von_hand") : plan, c.aktiv === false ? t("rl.automatik_aus") : ""].filter(Boolean).join(" · "))}</div></div>
          <button class="knopf klein" data-rollo="${esc(r.entity_id)}">${esc(t("knopf.bearbeiten"))}</button></div>`; }).join("")}</div>

    <div class="tafel"><h2>${esc(t("es.tage"))}</h2><div class="zeile">
      <label class="feld">${esc(t("es.schulfrei"))}${entitaetWahl("schulfrei_entity", e.schulfrei_entity, "schalter")}</label>
      <label class="feld">${esc(t("es.schulfrei_morgen"))}${entitaetWahl("schulfrei_morgen_entity", e.schulfrei_morgen_entity, "schalter")}</label>
      <label class="feld">${esc(t("es.aussen"))}${entitaetWahl("aussen_entity", e.aussen_entity, "aussen")}</label></div>
      <div class="zeile" style="justify-content:flex-end"><button class="knopf haupt" data-e-speichern>${esc(t("knopf.speichern"))}</button></div></div>

    <div class="tafel"><h2>${esc(t("es.waechter"))}</h2>
      <label class="haken"><input type="checkbox" data-e="wachhund.aktiv" ${w.aktiv ? "checked" : ""}>${esc(t("es.waechter_an"))}</label>
      <div class="zeile"><label class="feld">${esc(t("es.stumm"))}<input type="number" data-e="wachhund.stumm_stunden" value="${w.stumm_stunden}"></label></div>
      <div class="zeile" style="justify-content:flex-end"><button class="knopf haupt" data-e-speichern>${esc(t("knopf.speichern"))}</button></div></div>

    <div class="tafel"><h2>${esc(t("es.anzeige"))}</h2>
      <label class="haken"><input type="checkbox" data-e="prozent_invertiert" ${e.prozent_invertiert ? "checked" : ""}>${esc(t("es.invertiert"))}</label>
      <p class="leise klein">${esc(t("es.invertiert_hilfe"))}</p>
      <div class="zeile" style="justify-content:flex-end"><button class="knopf haupt" data-e-speichern>${esc(t("knopf.speichern"))}</button></div></div>

    <div class="tafel"><h2>${esc(t("es.protokoll"))}</h2><div class="protokoll">
      ${(log || []).slice(0, 40).map((l) => `<div><span class="leise">${esc(new Date(l.zeit).toLocaleString(SPRACHE === "en" ? "en-GB" : "de-DE", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"}))}</span>
        <span><b>${esc(l.raum)}</b> ${esc(l.was)} <span class="leise">– ${esc(l.warum)}</span></span></div>`).join("") || `<p class="leer">${esc(t("es.protokoll_leer"))}</p>`}</div></div>

    <div class="tafel"><h2>${esc(t("es.erweitert"))}</h2><p class="leise klein" style="margin-bottom:10px">${esc(t("es.erweitert_text"))}</p>
      <a class="knopf" href="erweitert.html" style="display:inline-flex; align-items:center; text-decoration:none; color:var(--text)">${esc(t("es.erweitert_knopf"))}</a></div>`;
}
$("#einstellungen").addEventListener("click", async (ev) => {
  const k = ev.target.closest("button"); if (!k) return;
  if (k.dataset.eSpeichern !== undefined){
    const neu = sammle(k.closest(".tafel"));
    try { await versuch(() => sende("api/einstellungen", "PUT", neu), t("allg.gespeichert")); } catch { return; }
    await nachrechnen(); zeichneEinstellungen();
  }
  if (k.dataset.rollo) rolloDialog(k.dataset.rollo);
});

function rolloDialog(eid){
  const r = kopie(rolloCfg(eid)); const b = (BERICHT?.rollos || []).find((x) => x.entity_id === eid);
  $("#dlg-titel").textContent = b ? b.name : eid;
  $("#dlg-inhalt").innerHTML = `
    <div class="zeile"><label class="feld" style="flex:1">${esc(t("rd.name"))}<input type="text" name="name" value="${esc(r.name)}" placeholder="${esc(b?.name || "")}"></label>
      <label class="feld" style="flex:1">${esc(t("rd.raum"))}<input type="text" name="raum" value="${esc(r.raum)}"></label></div>
    <div class="zeile"><label class="feld">${esc(t("rd.art"))}<select name="art">${["fenster","balkontuer","terrassentuer","dachfenster","haustuer"].map((a) =>
      `<option value="${a}" ${r.art === a ? "selected" : ""}>${esc(t("art." + a))}</option>`).join("")}</select></label>
      <label class="feld">${esc(t("rd.betrieb"))}<select name="betriebsart">${["plan","nur_schliessen","beobachten","von_hand"].map((a) =>
      `<option value="${a}" ${r.betriebsart === a ? "selected" : ""}>${esc(t("rd.b." + a))}</option>`).join("")}</select></label>
      <label class="feld">${esc(t("rd.plan"))}<select name="plan"><option value="">${esc(t("ed.eigener"))}</option>${(CONFIG.plaene || []).map((p) =>
      `<option value="${esc(p.id)}" ${r.plan === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select></label></div>
    <label class="haken"><input type="checkbox" name="aktiv" ${r.aktiv !== false ? "checked" : ""}>${esc(t("rd.automatik"))}</label>
    <label class="haken"><input type="checkbox" name="fluchtweg" ${r.fluchtweg !== false ? "checked" : ""}>${esc(t("rd.fluchtweg"))}</label>
    <div class="zeile"><label class="haken"><input type="checkbox" name="beschattung" ${r.beschattung ? "checked" : ""}>${esc(t("rd.hitze"))}</label>
      <label class="feld">${esc(t("rd.richtung"))}<input type="number" name="ausrichtung" value="${r.ausrichtung ?? ""}" min="0" max="359"></label></div>`;
  const dlg = $("#dialog");
  dlg.onclose = async () => {
    if (dlg.returnValue !== "ok") return;
    const f = $("#dlg-form");
    r.name = f.name.value.trim(); r.raum = f.raum.value.trim(); r.art = f.art.value;
    r.betriebsart = f.betriebsart.value; r.plan = f.plan.value; r.aktiv = f.aktiv.checked;
    r.fluchtweg = f.fluchtweg.checked; r.beschattung = f.beschattung.checked;
    r.ausrichtung = f.ausrichtung.value === "" ? null : Number(f.ausrichtung.value);
    if (!r.plan && !(r.zeitplan || []).length){ const q = (CONFIG.plaene || []).find((p) => p.id === rolloCfg(eid).plan); if (q) r.zeitplan = kopie(q.zeitplan); }
    try { await versuch(() => sende(`api/rollos/${encodeURIComponent(eid)}`, "PUT", r), t("allg.gespeichert")); } catch { return; }
    await nachrechnen(); zeichneEinstellungen();
  };
  dlg.returnValue = ""; dlg.showModal();
}

/* ═══ Reiter ═══ */
$$("nav button").forEach((k) => k.addEventListener("click", async () => {
  REITER = k.dataset.reiter;
  $$("nav button").forEach((x) => x.classList.toggle("an", x === k));
  $$("main section").forEach((s) => s.classList.toggle("an", s.id === "s-" + REITER));
  try { history.replaceState(null, "", "#" + REITER); } catch {}
  if (REITER === "heute") zeichneHeute();
  if (REITER === "ablauf"){ await ladeAblauf(); zeichneEditor(); }
  if (REITER === "programme"){ if (!ENT){ try { ENT = await hole("api/entitaeten"); } catch { ENT = {}; } } zeichneProgramme(); }
  if (REITER === "einstellungen") zeichneEinstellungen();
}));
$("#alle-auf").addEventListener("click", () => alleFahren(100));
$("#alle-zu").addEventListener("click", () => alleFahren(0));

(async () => {
  await laden();
  const start = (location.hash || "").slice(1);
  const k = $(`nav [data-reiter="${start}"]`);
  if (k) k.click();
  setInterval(() => { if (!document.hidden) laden(); }, 30000);
})();
</script>
