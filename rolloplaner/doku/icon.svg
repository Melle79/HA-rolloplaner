<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grund" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a35"/>
      <stop offset="1" stop-color="#151a22"/>
    </linearGradient>
    <!-- Der Himmel wird nur im unteren Drittel sichtbar; der Verlauf liegt
         deshalb dort, sonst wäre die Öffnung eine einfarbige Fläche. -->
    <linearGradient id="himmel" x1="0" y1="0.5" x2="0" y2="1">
      <stop offset="0" stop-color="#6ba2e8"/>
      <stop offset="1" stop-color="#bce2fb"/>
    </linearGradient>
    <linearGradient id="panzer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f5f9"/>
      <stop offset="1" stop-color="#bcc5d0"/>
    </linearGradient>
    <!-- In festen Koordinaten und nicht in der Bounding-Box des Elements:
         Ein waagerechter Strahl hat eine Box ohne Höhe, und ein Verlauf
         darüber ist entartet – Chrome zeichnet dann gar nichts. Die beiden
         seitlichen Strahlen fehlten deshalb spurlos. -->
    <linearGradient id="sonne" gradientUnits="userSpaceOnUse"
                    x1="0" y1="74" x2="0" y2="106">
      <stop offset="0" stop-color="#ffdd93"/>
      <stop offset="1" stop-color="#efa634"/>
    </linearGradient>
    <clipPath id="fenster">
      <rect x="20" y="22" width="88" height="88" rx="10"/>
    </clipPath>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#grund)"/>

  <g clip-path="url(#fenster)">
    <rect x="20" y="22" width="88" height="88" fill="url(#himmel)"/>

    <!-- Die Sonne steht im Fenster, der Panzer kommt ihr entgegen. Alle
         Strahlen liegen im sichtbaren Himmel: Ein Strahl, der halb hinter dem
         Panzer endet, sieht nach Fehler aus, nicht nach Absicht. -->
    <g stroke="url(#sonne)" stroke-width="5.5" stroke-linecap="round">
      <path d="M48.5 90 H43"/><path d="M79.5 90 H85"/>
      <path d="M53 101 L49 105"/><path d="M75 101 L79 105"/>
      <path d="M53 79 L49 75"/><path d="M75 79 L79 75"/>
    </g>
    <circle cx="64" cy="90" r="13" fill="url(#sonne)"/>

    <!-- Der Panzer: eine Fläche mit dunklen Fugen, nicht vier Balken. Durch
         die Fugen sah sonst der Himmel hindurch, und das las sich als
         Streifenmuster statt als Rollladen. -->
    <rect x="20" y="22" width="88" height="42" fill="url(#panzer)"/>
    <g stroke="#7f8894" stroke-width="2">
      <path d="M20 33.5 H108"/><path d="M20 44.5 H108"/><path d="M20 55.5 H108"/>
    </g>
    <!-- Die Schlussleiste, an der man ein Rollo erkennt -->
    <rect x="20" y="64" width="88" height="7" fill="#8b95a2"/>
    <rect x="20" y="64" width="88" height="2.5" fill="#cbd3dc"/>
    <!-- Der Kasten, aus dem der Panzer kommt -->
    <rect x="20" y="22" width="88" height="9" fill="#d2d9e1"/>
  </g>
</svg>
